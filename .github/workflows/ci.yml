name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      ai-server: ${{ steps.diff.outputs.ai-server }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: 바뀐 서비스 판별
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          printf '%s\n' "$files"
          changed() {
            if printf '%s\n' "$files" | grep -qE '^\.github/workflows/'; then echo true; return; fi
            if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }
          {
            echo "backend=$(changed '^backend/')"
            echo "frontend=$(changed '^frontend/')"
            echo "ai-server=$(changed '^(ai|pipelines)/')"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Backend Test
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon
      - uses: docker/setup-buildx-action@v3
      - name: Backend Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: auth Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          build-args: MODULE=auth
          cache-from: type=gha,scope=backend
      - name: canvas Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          build-args: MODULE=canvas
          cache-from: type=gha,scope=backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - name: Frontend Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ai-server:
    needs: changes
    if: needs.changes.outputs.ai-server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai/server/requirements.txt }
      - name: ai-server Test
        working-directory: ai/server
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/pipelines
        run: |
          pip install -r requirements.txt
          python -m pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: ai-server Image Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai/server/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ai-server
          cache-to: type=gha,mode=max,scope=ai-server

  # 필수 체크(ruleset require-ci)가 요구하는 이름. 서비스별 결과를 모아 하나로 판정한다
  build:
    needs: [changes, backend, frontend, ai-server]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 서비스별 결과 집계
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(printf '%s' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(",")')
          if [ -n "$bad" ]; then echo "실패한 job: $bad"; exit 1; fi
