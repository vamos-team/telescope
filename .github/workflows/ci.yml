name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      be_research: ${{ steps.diff.outputs.be_research }}
      be_auth: ${{ steps.diff.outputs.be_auth }}
      be_canvas: ${{ steps.diff.outputs.be_canvas }}
      frontend: ${{ steps.diff.outputs.frontend }}
      ai-server: ${{ steps.diff.outputs.ai-server }}
      ai_agent: ${{ steps.diff.outputs.ai_agent }}
      ai_ingest: ${{ steps.diff.outputs.ai_ingest }}
      ai_mcp: ${{ steps.diff.outputs.ai_mcp }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: 바뀐 서비스 판별
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          printf '%s\n' "$files"
          changed() {
            if printf '%s\n' "$files" | grep -qE '^\.github/workflows/'; then echo true; return; fi
            if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }
          # JVM 모듈 이미지: 공통(backend-common·gradle 루트 파일)이 바뀌면 셋 다, 아니면 바뀐 모듈만
          be_module() {
            if printf '%s\n' "$files" | grep -qE '^\.github/workflows/|^libs/backend-common/|^(settings\.gradle|build\.gradle|gradlew|gradle/|Dockerfile\.jvm)'; then echo true; return; fi
            if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }
          {
            echo "backend=$(changed '^(services/(auth|canvas|research)/|libs/backend-common/|settings\.gradle|build\.gradle|gradlew|gradle/|Dockerfile\.jvm)')"
            echo "be_research=$(be_module '^services/research/')"
            echo "be_auth=$(be_module '^services/auth/')"
            echo "be_canvas=$(be_module '^services/canvas/')"
            echo "frontend=$(changed '^services/frontend/')"
            echo "ai-server=$(changed '^(services/(agent|ingestion-worker|retrieval)/|libs/job-shell/)')"
            # ai 이미지별 세분: agent=services/agent+job-shell, ingest=ingestion-worker+job-shell, mcp=retrieval
            # job-shell(공유 셸)이 바뀌면 agent·ingest 둘 다 빌드된다
            echo "ai_agent=$(changed '^(services/agent/|libs/job-shell/)')"
            echo "ai_ingest=$(changed '^(services/ingestion-worker/|libs/job-shell/)')"
            echo "ai_mcp=$(changed '^services/retrieval/')"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Backend Test
        run: chmod +x gradlew && ./gradlew test --no-daemon
      - uses: docker/setup-buildx-action@v3
      - name: research Image Build
        if: needs.changes.outputs.be_research == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jvm
          platforms: linux/amd64
          push: false
          build-args: MODULE=research
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: auth Image Build
        if: needs.changes.outputs.be_auth == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jvm
          platforms: linux/amd64
          push: false
          build-args: MODULE=auth
          cache-from: type=gha,scope=backend
      - name: canvas Image Build
        if: needs.changes.outputs.be_canvas == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jvm
          platforms: linux/amd64
          push: false
          build-args: MODULE=canvas
          cache-from: type=gha,scope=backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - name: Frontend Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ai-server:
    needs: changes
    if: needs.changes.outputs.ai-server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      ROLE_ARN: arn:aws:iam::881490135253:role/gha-p3-1
      ECR_REPOSITORY: teams/p3-1/app
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: libs/job-shell/requirements.txt }
      - name: job-shell Test
        # 공유 셸(job-shell)·agent·ingestion 중 하나라도 바뀌면 실행. retrieval만 바뀌면 건너뜀
        if: ${{ needs.changes.outputs.ai_agent == 'true' || needs.changes.outputs.ai_ingest == 'true' }}
        working-directory: libs/job-shell
        run: |
          pip install -e .
          python -m pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: ingest base 이미지 준비(requirements 바뀔 때만 빌드·푸시, 아니면 ECR 재사용)
        if: ${{ needs.changes.outputs.ai_ingest == 'true' }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          BASE_TAG="ingestion-worker-base-$(git rev-parse HEAD:services/ingestion-worker/requirements.txt | cut -c1-12)"
          echo "BASE_REF=$REGISTRY/$ECR_REPOSITORY:$BASE_TAG" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$BASE_TAG" >/dev/null 2>&1; then
            echo "base 이미 있음: $BASE_TAG"
          else
            echo "base 빌드·푸시: $BASE_TAG"
            docker buildx build --platform linux/amd64 -f services/ingestion-worker/base.Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$BASE_TAG" --push .
          fi
      - name: agent Image Build
        if: ${{ needs.changes.outputs.ai_agent == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agent/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache-agent
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache-agent,mode=max
      - name: ingestion-worker Image Build
        if: ${{ needs.changes.outputs.ai_ingest == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ingestion-worker/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: INGEST_BASE=${{ env.BASE_REF }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache-ingestion-worker
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache-ingestion-worker,mode=max
      - name: retrieval Image Build
        if: ${{ needs.changes.outputs.ai_mcp == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./services/retrieval
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache-retrieval
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache-retrieval,mode=max

  # 필수 체크(ruleset require-ci)가 요구하는 이름. 서비스별 결과를 모아 하나로 판정한다
  build:
    needs: [changes, backend, frontend, ai-server]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 서비스별 결과 집계
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(printf '%s' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(",")')
          if [ -n "$bad" ]; then echo "실패한 job: $bad"; exit 1; fi
