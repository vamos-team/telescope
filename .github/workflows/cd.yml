name: CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ROLE_ARN: arn:aws:iam::881490135253:role/gha-p3-1
  CLUSTER: skala-pg
  NAMESPACE: p3-1
  ECR_REPOSITORY: teams/p3-1/app

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, skala-runner]
    if: github.repository == 'vamos-team/telescope'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: 서비스별 이미지 태그 계산
        id: tags
        run: |
          tree() { git rev-parse "HEAD:$1" | cut -c1-12; }
          combined() { for d in "$@"; do git rev-parse "HEAD:$d"; done | sha256sum | cut -c1-12; }
          need_build() { aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$1" >/dev/null 2>&1 && echo false || echo true; }
          # backend 서비스별 태그 = 그 모듈 + 공통(common·루트 빌드 파일)의 내용 해시. 공통이 바뀌면 셋 다, 한 모듈만 바뀌면 그 서비스만 재빌드된다
          BE_SHARED="backend/common backend/build.gradle backend/settings.gradle backend/Dockerfile backend/.dockerignore backend/gradlew backend/gradle"
          BACKEND="backend-$(combined backend/analysis $BE_SHARED)"
          AUTH="auth-$(combined backend/auth $BE_SHARED)"
          CANVAS="canvas-$(combined backend/canvas $BE_SHARED)"
          FRONTEND="frontend-$(tree frontend)"
          AI_SERVER="ai-server-$(combined ai pipelines)"
          {
            echo "backend=$BACKEND"; echo "build_backend=$(need_build "$BACKEND")"
            echo "auth=$AUTH"; echo "build_auth=$(need_build "$AUTH")"
            echo "canvas=$CANVAS"; echo "build_canvas=$(need_build "$CANVAS")"
            echo "frontend=$FRONTEND"; echo "build_frontend=$(need_build "$FRONTEND")"
            echo "ai_server=$AI_SERVER"; echo "build_ai_server=$(need_build "$AI_SERVER")"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.tags.outputs.build_backend == 'true' || steps.tags.outputs.build_auth == 'true' || steps.tags.outputs.build_canvas == 'true'
        with: { distribution: temurin, java-version: "21" }
      - name: Backend Test
        if: steps.tags.outputs.build_backend == 'true' || steps.tags.outputs.build_auth == 'true' || steps.tags.outputs.build_canvas == 'true'
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - name: Build & push (바뀐 서비스만)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BACKEND: ${{ steps.tags.outputs.backend }}
          FRONTEND: ${{ steps.tags.outputs.frontend }}
          AI_SERVER: ${{ steps.tags.outputs.ai_server }}
          AUTH: ${{ steps.tags.outputs.auth }}
          CANVAS: ${{ steps.tags.outputs.canvas }}
          BUILD_BACKEND: ${{ steps.tags.outputs.build_backend }}
          BUILD_AUTH: ${{ steps.tags.outputs.build_auth }}
          BUILD_CANVAS: ${{ steps.tags.outputs.build_canvas }}
          BUILD_FRONTEND: ${{ steps.tags.outputs.build_frontend }}
          BUILD_AI_SERVER: ${{ steps.tags.outputs.build_ai_server }}
        run: |
          build() {
            if [ "$1" != true ]; then echo "$2 는 이미 ECR 에 있음, 빌드/푸시 건너뜀"; return; fi
            docker buildx build --platform linux/amd64 -t "$REGISTRY/$ECR_REPOSITORY:$2" -f "$3" --push "${@:5}" "$4"
          }
          build "$BUILD_BACKEND" "$BACKEND" backend/Dockerfile backend
          build "$BUILD_AUTH" "$AUTH" backend/Dockerfile backend --build-arg MODULE=auth
          build "$BUILD_CANVAS" "$CANVAS" backend/Dockerfile backend --build-arg MODULE=canvas
          build "$BUILD_FRONTEND" "$FRONTEND" frontend/Dockerfile frontend
          build "$BUILD_AI_SERVER" "$AI_SERVER" ai/server/Dockerfile .
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: kustomize 설치
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]'); ARCH=$(uname -m); [ "$ARCH" = x86_64 ] && ARCH=amd64; [ "$ARCH" = aarch64 ] && ARCH=arm64
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_${OS}_${ARCH}.tar.gz" | tar xz -C "$RUNNER_TEMP" kustomize

      - name: 클러스터 연결
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: 이미지 태그 지정
        working-directory: infra/k8s
        run: |
          "$RUNNER_TEMP/kustomize" edit set image \
            "skala-registry.skala-ai.com/p3-1/backend=$REGISTRY/$ECR_REPOSITORY:${{ steps.tags.outputs.backend }}" \
            "skala-registry.skala-ai.com/p3-1/auth=$REGISTRY/$ECR_REPOSITORY:${{ steps.tags.outputs.auth }}" \
            "skala-registry.skala-ai.com/p3-1/canvas=$REGISTRY/$ECR_REPOSITORY:${{ steps.tags.outputs.canvas }}" \
            "skala-registry.skala-ai.com/p3-1/frontend=$REGISTRY/$ECR_REPOSITORY:${{ steps.tags.outputs.frontend }}" \
            "skala-registry.skala-ai.com/p3-1/ai-server=$REGISTRY/$ECR_REPOSITORY:${{ steps.tags.outputs.ai_server }}"

      # Ingress 의 허용 IP 는 저장소에 두지 않고 시크릿 ALLOWED_IPS에서 받아 배포 때만 넣는다.
      - name: 허용 IP 주입
        working-directory: infra/k8s
        env:
          ALLOWED_IPS: ${{ secrets.ALLOWED_IPS }}
        run: |
          ALLOWED_IPS=$(printf '%s' "$ALLOWED_IPS" | tr -d '\r\n')   # 끝의 줄바꿈만 제거
          test -n "$ALLOWED_IPS" || { echo "시크릿 ALLOWED_IPS 가 비어 있음"; exit 1; }
          # 값은 로그에 찍지 않고 형식만 확인한다: x.x.x.x/32 를 쉼표로만 이은 한 줄 (공백, 줄바꿈 없음, 각 옥텟 0-255)
          OCTET='(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          IP="${OCTET}\.${OCTET}\.${OCTET}\.${OCTET}/32"
          printf '%s' "$ALLOWED_IPS" | grep -Eq "^${IP}(,${IP})*$" \
            || { echo "시크릿 ALLOWED_IPS 형식이 올바르지 않음 (예: 1.2.3.4/32,5.6.7.8/32)"; exit 1; }
          cat > ingress-allowed-ips.yaml <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: web
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "$ALLOWED_IPS"
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: api
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "$ALLOWED_IPS"
          EOF
          printf 'patches:\n  - path: ingress-allowed-ips.yaml\n' >> kustomization.yaml
          test "$(kubectl kustomize . | grep -c 'whitelist-source-range')" -eq 2 || { echo "허용 IP 가 두 Ingress에 모두 들어가지 않음"; exit 1; }

      - name: 배포
        working-directory: infra/k8s
        run: |
          kubectl -n "$NAMESPACE" apply -k .
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/auth --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/canvas --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=300s
          kubectl -n "$NAMESPACE" rollout status statefulset/chroma --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/pg-proxy --timeout=120s
          kubectl -n "$NAMESPACE" rollout status statefulset/ai-server --timeout=300s
