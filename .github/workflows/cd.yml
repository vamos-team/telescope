name: CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["infra/k8s/**"]

env:
  REGISTRY: skala-registry.skala-ai.com
  PROJECT: p3-1
  APP: p3-1-web
  IS_DEPLOY: ${{ github.event_name == 'push' }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: 태그 = 커밋 해시 7자리
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Backend Test
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - uses: docker/setup-buildx-action@v3
      - if: env.IS_DEPLOY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Backend Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: ${{ env.IS_DEPLOY == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/backend:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: ${{ env.IS_DEPLOY == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/frontend:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: 이미지 태그 갱신 (infra/k8s/kustomization.yaml)
        if: env.IS_DEPLOY == 'true'
        working-directory: infra/k8s
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          for s in frontend backend; do
            ./kustomize edit set image "$REGISTRY/$PROJECT/$s=$REGISTRY/$PROJECT/$s:$TAG"
          done
          rm kustomize
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git commit -am "deploy: ${TAG}"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Argo CD sync
        if: env.IS_DEPLOY == 'true'
        run: |
          curl -sSL -o argocd https://skala-argocd.skala-ai.com/download/argocd-linux-amd64 && chmod +x argocd
          ./argocd app sync "$APP" --server skala-argocd.skala-ai.com --grpc-web --auth-token "${{ secrets.ARGOCD_CI_TOKEN }}"
          ./argocd app wait "$APP" --server skala-argocd.skala-ai.com --grpc-web --auth-token "${{ secrets.ARGOCD_CI_TOKEN }}" --health --timeout 300
