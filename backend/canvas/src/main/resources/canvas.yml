spring:
  application:
    name: telescope-canvas
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.default_schema]": app

app:
  internal-api-key: ${INTERNAL_API_KEY:}
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:1h}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
