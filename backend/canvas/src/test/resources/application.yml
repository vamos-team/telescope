# canvas 모듈 테스트 설정. 스키마는 엔티티에서 생성(create-drop), Flyway는 쓰지 않는다.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: test-only-jwt-secret-key-0123456789abcdef
  internal-api-key: ${INTERNAL_API_KEY:}
  auth-service:
    base-url: http://localhost:8081
