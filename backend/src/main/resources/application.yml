spring:
  application:
    name: telescope-backend
  profiles:
    default: local
  # RDS는 공용 인스턴스라 우리 테이블은 app 스키마에만 둔다. 스키마가 없으면 Flyway가 만든다.
  flyway:
    default-schema: app
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.default_schema]": app

# infra 구현체 전환용 설정. 실제 ai 서비스/클라우드 스토리지가 생기면 여기서 바꾼다.
infra:
  python-ai-client:
    mode: stub # stub | (TODO: 실제 구현 생기면 값 추가)

app:
  storage:
    local:
      base-dir: ${FILE_STORAGE_DIR:./data/files}
    # 버킷이 설정되면(배포: s3-config ConfigMap) S3에, 없으면(로컬) 위 디렉터리에 저장한다.
    # 자격증명은 기본 체인(배포는 IRSA)을 쓴다. 키를 설정 파일에 넣지 않는다.
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:}
