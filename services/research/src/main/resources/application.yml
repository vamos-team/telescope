spring:
  application:
    name: telescope-backend
  profiles:
    default: local
  # RDS는 공용 인스턴스라 우리 테이블은 app 스키마에만 둔다. 스키마가 없으면 Flyway가 만든다.
  flyway:
    default-schema: app
  # 업로드 크기 상한(#111). 배포 Ingress(nginx)의 body 크기 제한도 같은 값으로 맞춰야 한다(infra)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.default_schema]": app

# infra 구현체 전환용 설정.
infra:
  python-ai-client:
    # stub(기본, 가짜 구현) | http(ai/server 실제 호출). http면 주소와 비밀키가 필요하다(없으면 기동 실패).
    mode: ${AI_SERVICE_MODE:stub}
    base-url: ${AI_SERVICE_BASE_URL:}
    # 데이터 파이프라인(ingest-worker) 주소. http 모드에서 필수
    ingest-base-url: ${INGEST_SERVICE_BASE_URL:}
    # ai/server의 INTERNAL_API_KEY와 같은 값. 설정 파일에 값을 넣지 않는다
    api-key: ${AI_SERVICE_API_KEY:}
    # ai-contract 2.10 제안값
    connect-timeout: 2s
    start-read-timeout: 5s
    status-read-timeout: 3s

app:
  internal-api-key: ${INTERNAL_API_KEY:}
  # 캔버스 권한을 확인하는 canvas 서비스 주소(내부)
  canvas-service:
    base-url: ${CANVAS_SERVICE_BASE_URL:http://localhost:8082}
  # 재무 데이터 적재 배치(#135). 시작은 cron(서울 시간), "-"이면 꺼짐(로컬·테스트 기본). 배포는 DATASYNC_CRON="0 0 3 * * *"
  datasync:
    cron: ${DATASYNC_CRON:-}
    poll-interval: ${DATASYNC_POLL_INTERVAL:PT1M}
    # 대상 회사 DART 고유번호(쉼표로 구분). 비어 있으면 적재를 시작하지 않는다
    corp-codes: ${DATASYNC_CORP_CODES:}
    years: ${DATASYNC_YEARS:5}
  # 액세스 토큰(#34). 서명 키는 환경변수로만 넣는다(32바이트 이상, 없으면 기동 실패). 기본 1시간, refresh 토큰 없음(api-spec 10장)
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:1h}
  # 첫 관리자 시드(#133). 사번·비밀번호가 비면 건너뛰고, 사번이 이미 있으면 바꾸지 않는다
  # 로그인 실패 잠금(#164). 같은 사번으로 연속 max-failures번 틀리면 lock-duration 동안 막는다(docs/backend/auth.md)
  auth:
    login:
      max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
      lock-duration: ${AUTH_LOGIN_LOCK_DURATION:PT10M}
  admin:
    employee-no: ${ADMIN_EMPLOYEE_NO:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:}
  document:
    upload:
      # 업로드 정책이 정해지기 전까지 ai 파서가 읽는 형식으로 임시 제한한다(루트 AGENTS.md 7장 미정, #111)
      allowed-extensions: pdf,xlsx,xlsm,csv,pptx,html,htm,xml,txt,md,json
      # 업로드 대상 회사. 사용자가 이 중에서 고른다. 늘어날 수 있어 설정으로 둔다(#111)
      companies: SKT,SKB,KT,LGU+
  job:
    # ai가 끝났다고 알려 준 작업의 결과 저장이 이 횟수만큼 실패하면 FAILED로 끝낸다(#63)
    result-save-max-attempts: 5
  storage:
    local:
      base-dir: ${FILE_STORAGE_DIR:./data/files}
    # 버킷이 설정되면(배포: s3-config ConfigMap) S3에, 없으면(로컬) 위 디렉터리에 저장한다.
    # 자격증명은 기본 체인(배포는 IRSA)을 쓴다. 키를 설정 파일에 넣지 않는다.
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
