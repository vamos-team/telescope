name: telescope

services:
  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-telescope-backend}
    env_file:
      - path: .env
        required: false
    # .env의 SPRING_DATASOURCE_*는 호스트 bootRun용(localhost)이라, 컨테이너에서는 서비스명(postgres)으로 덮어쓴다
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telescope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-telescope}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
      # 문서의 캔버스 권한 확인(분리 후 canvas 서비스 호출). 전체 스택은 --profile msa
      CANVAS_SERVICE_BASE_URL: http://canvas:8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"

  auth:
    build:
      context: ./backend
      args: { MODULE: auth }
    image: ${AUTH_IMAGE:-telescope-auth}
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telescope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-telescope}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
    depends_on:
      - backend
    restart: on-failure
    ports:
      - "8081:8080"
    profiles: ["msa"]

  canvas:
    build:
      context: ./backend
      args: { MODULE: canvas }
    image: ${CANVAS_IMAGE:-telescope-canvas}
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telescope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-telescope}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
      AUTH_SERVICE_BASE_URL: http://auth:8080
    depends_on:
      - backend
      - auth
    restart: on-failure
    ports:
      - "8082:8080"
    profiles: ["msa"]

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-telescope-frontend}
    depends_on:
      - backend
    ports:
      - "80:80"

  # 평소엔 뜨지 않음. 실행: docker compose run --rm pipelines <명령>
  pipelines:
    build: ./pipelines
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    profiles: ["batch"]

  # 로컬 개발용 PostgreSQL. 배포 환경(RDS PostgreSQL 18)과 같은 메이저 버전.
  # backend 컨테이너는 서비스명(postgres)으로 접속하고,
  # 호스트에서 ./gradlew bootRun 할 때는 .env의 SPRING_DATASOURCE_URL(localhost)로 붙여 쓴다.
  # .env가 없어도(CI 등) 기본값으로 뜰 수 있도록 environment에 기본값을 둔다.
  # RDS에 붙으려고 pg-proxy를 5432로 port-forward하는 중이면 POSTGRES_PORT를 다른 값으로 바꾼다.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telescope}
      POSTGRES_USER: ${POSTGRES_USER:-telescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18 이미지부터 데이터 볼륨 경로가 /var/lib/postgresql로 바뀌었다
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
