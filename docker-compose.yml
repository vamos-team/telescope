name: telescope

services:
  research:
    build:
      context: .
      dockerfile: Dockerfile.jvm
      args: { MODULE: research }
    image: ${RESEARCH_IMAGE:-telescope-research}
    env_file:
      - path: .env
        required: false
    # .env의 SPRING_DATASOURCE_*는 호스트 bootRun용(localhost)이라, 컨테이너에서는 서비스명(postgres)으로 덮어쓴다
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telescope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-telescope}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
      # 문서의 캔버스 권한 확인(분리 후 canvas 서비스 호출). 전체 스택은 --profile msa
      CANVAS_SERVICE_BASE_URL: http://canvas:8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"

  auth:
    build:
      context: .
      dockerfile: Dockerfile.jvm
      args: { MODULE: auth }
    image: ${AUTH_IMAGE:-telescope-auth}
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telescope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-telescope}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
    depends_on:
      - research
    restart: on-failure
    ports:
      - "8081:8080"
    profiles: ["msa"]

  canvas:
    build:
      context: .
      dockerfile: Dockerfile.jvm
      args: { MODULE: canvas }
    image: ${CANVAS_IMAGE:-telescope-canvas}
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telescope}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-telescope}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
      AUTH_SERVICE_BASE_URL: http://auth:8080
    depends_on:
      - research
      - auth
    restart: on-failure
    ports:
      - "8082:8080"
    profiles: ["msa"]

  frontend:
    build: ./services/frontend
    image: ${FRONTEND_IMAGE:-telescope-frontend}
    depends_on:
      - research
    ports:
      - "80:80"

  # 평소엔 뜨지 않음. 실행: docker compose run --rm ingestion-worker <명령>
  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    profiles: ["batch"]

  # 로컬 개발용 PostgreSQL. 배포 환경(RDS PostgreSQL 18)과 같은 메이저 버전.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telescope}
      POSTGRES_USER: ${POSTGRES_USER:-telescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telescope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18 이미지부터 데이터 볼륨 경로가 /var/lib/postgresql로 바뀌었다
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 로컬 개발용 Kafka(KRaft 단일 브로커). 호스트에서 localhost:29092, 컨테이너 안에서 kafka:9092
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: telescope-kafka-local-kraft
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  postgres_data:
