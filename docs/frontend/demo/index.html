<title>Telescope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Hallmark · shape: app screen · genre: product tool · theme: TDS + SKT 보라 (user named, by request) · posture: restrained · copy: verbatim · states: 8 · contrast: pass */
/* Layout: 왼쪽 사이드바 + 작업 영역. TDS 원칙(면과 여백으로 구분, fill/weak 버튼, 쿨그레이 글자)에 SKT 보라를 주색으로. */
:root{
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bg:#FFFFFF; --bg-grey:#F2F4F6; --bg-doc:#ECEEF2; --surface:#FFFFFF; --side:#F9FAFB;
  --line:#E5E8EB; --line-2:#D1D6DB; --hover:rgba(2,32,71,.05);
  --t-strong:#191F28; --t:#333D4B; --t-sub:#4E5968; --t-cap:#6B7684; --t-ph:#8B95A1;
  --primary:#3617CE; --primary-press:#2A10A8; --primary-text:#3617CE; --primary-weak:rgba(54,23,206,.09); --on-primary:#FFFFFF;
  --red:#D22030; --red-weak:rgba(240,68,82,.13); --red-line:#E42939;
  --yel:#8A5A00; --yel-weak:rgba(255,195,66,.30); --yel-line:#D99A00;
  --green:#027A4A; --green-weak:rgba(3,178,108,.12);
  --s1:#6250D6; --s2:#EB6834; --s3:#1BAF7A; --s4:#EDA100;
  --dim:rgba(0,0,0,.5); --shadow:0 2px 10px rgba(0,27,55,.08); --shadow-pop:0 12px 40px rgba(0,0,0,.18);
  --shadow-seg:0 1px 2px rgba(0,0,0,.09); --r-sm:8px; --r-md:10px; --r-lg:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141418; --bg-grey:#1B1B21; --bg-doc:#101014; --surface:#1E1E25; --side:#18181D;
  --line:#2C2C35; --line-2:#3A3A45; --hover:rgba(255,255,255,.06);
  --t-strong:#F2F2F6; --t:#DADAE2; --t-sub:#B4B4C0; --t-cap:#9696A4; --t-ph:#76768A;
  --primary:#6A55F2; --primary-press:#5A44E6; --primary-text:#A99BFF; --primary-weak:rgba(140,123,255,.16); --on-primary:#FFFFFF;
  --red:#FF8A8F; --red-weak:rgba(240,68,82,.20); --red-line:#FF6B72;
  --yel:#F5C451; --yel-weak:rgba(255,195,66,.18); --yel-line:#E8B23A;
  --green:#4FD39A; --green-weak:rgba(3,178,108,.18);
  --s1:#9085E9; --s2:#D95926; --s3:#199E70; --s4:#C98500;
  --dim:rgba(0,0,0,.62); --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-pop:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141418; --bg-grey:#1B1B21; --bg-doc:#101014; --surface:#1E1E25; --side:#18181D;
  --line:#2C2C35; --line-2:#3A3A45; --hover:rgba(255,255,255,.06);
  --t-strong:#F2F2F6; --t:#DADAE2; --t-sub:#B4B4C0; --t-cap:#9696A4; --t-ph:#76768A;
  --primary:#6A55F2; --primary-press:#5A44E6; --primary-text:#A99BFF; --primary-weak:rgba(140,123,255,.16); --on-primary:#FFFFFF;
  --red:#FF8A8F; --red-weak:rgba(240,68,82,.20); --red-line:#FF6B72;
  --yel:#F5C451; --yel-weak:rgba(255,195,66,.18); --yel-line:#E8B23A;
  --green:#4FD39A; --green-weak:rgba(3,178,108,.18);
  --s1:#9085E9; --s2:#D95926; --s3:#199E70; --s4:#C98500;
  --dim:rgba(0,0,0,.62); --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-pop:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}
html,body{height:100%;overflow-x:clip}
#root{height:100%}
body{margin:0;background:var(--bg);color:var(--t);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- buttons (TDS fill / weak) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r-md);font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s}
.btn.sm{height:32px;padding:0 12px;border-radius:var(--r-sm);font-size:13px}
.btn.lg{height:48px;padding:0 20px;border-radius:var(--r-lg);font-size:16px}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.fill:hover{background:var(--primary-press)}
.btn:active:not(:disabled),.icon-btn:active,.pick:active{transform:scale(.98)}
.btn.fill:disabled{background:var(--line);color:var(--t-sub);cursor:not-allowed}
.btn.weak{background:var(--primary-weak);color:var(--primary-text)}
.btn.grey{background:var(--hover);color:var(--t-sub)}
.btn.grey:hover,.btn.weak:hover{filter:brightness(.97)}
.btn.line{border:1px solid var(--line);background:var(--surface);color:var(--t)}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--t-sub)}
.icon-btn:hover{background:var(--hover)}
.icon-btn[aria-pressed="true"]{background:var(--primary-weak);color:var(--primary-text)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:500;background:var(--hover);color:var(--t-sub);white-space:nowrap;vertical-align:1px}
.tag.p{background:var(--primary-weak);color:var(--primary-text)}
.st-bad{color:var(--red);font-weight:700}
.st-q{color:var(--yel);font-weight:700}
.st-ok{color:var(--green);font-weight:700}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;background:var(--bg-grey);padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{width:min(400px,100%);background:var(--surface);border-radius:20px;padding:36px 32px;display:grid;gap:18px;box-shadow:var(--shadow)}
.login .brand{font-size:24px;font-weight:700;color:var(--t-strong);letter-spacing:-.01em}
.login .brand small{display:block;font-size:14px;font-weight:400;color:var(--t-sub);margin-top:4px;letter-spacing:0}
.field{display:grid;gap:6px;font-size:13px;color:var(--t-sub)}
.inp{height:48px;border-radius:12px;border:0;background:var(--bg-grey);padding:0 14px;font-size:15px;color:var(--t-strong)}
.inp:focus{outline:2px solid var(--primary-text);outline-offset:0}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;gap:18px;min-height:0;overflow:auto}
.logo{text-align:left;align-self:start;font-size:18px;font-weight:700;color:var(--t-strong);padding:2px 8px;letter-spacing:-.01em}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--r-sm);font-size:14px;color:var(--t);text-align:left;width:100%}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--hover);color:var(--t-strong);font-weight:500}
.grp{display:grid;gap:2px}
.grp>p{margin:0 0 4px;padding:0 10px;font-size:12px;color:var(--t-cap);display:flex;align-items:center;gap:6px}
.grp>p .dot{width:6px;height:6px;border-radius:50%;background:var(--t-ph)}
.grp>p .dot.p{background:var(--primary-text)}
.grp button{height:34px;padding:0 10px;border-radius:var(--r-sm);font-size:14px;text-align:left;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp button:hover{background:var(--hover)}
.step{display:flex!important;align-items:center;gap:10px}
.step .n{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--t-strong);color:var(--bg)}
.step .d{margin-left:auto;font-size:11.5px;color:var(--t-cap)}
.step[aria-current="step"]{background:var(--hover);font-weight:500;color:var(--t-strong)}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.user .av{width:30px;height:30px;border-radius:50%;background:var(--line)}
.user b{display:block;font-size:13.5px;color:var(--t-strong);font-weight:500;line-height:1.3}
.user small{font-size:12px;color:var(--t-cap)}
.user button{margin-left:auto;font-size:12px;color:var(--t-cap)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.mobilebar{display:none}

.hdr{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.hdr h1{margin:0;font-size:17px;font-weight:700;color:var(--t-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .r{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--bg-grey);font-size:12.5px;color:var(--t-sub);white-space:nowrap}
.chip b{color:var(--t-strong);font-weight:500}
.body{flex:1;min-height:0;display:flex}
.scroll{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.scroll>*{flex:none}
.scroll>.hero{flex:1 0 auto}

/* ---------- B10 new analysis ---------- */
.hero{display:grid;place-items:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.compose{width:min(760px,100%);display:grid;gap:28px}
.compose h2{margin:0;text-align:center;font-size:26px;line-height:1.35;font-weight:700;color:var(--t-strong);letter-spacing:-.01em;text-wrap:balance}
.tray{background:var(--bg-grey);border-radius:20px;padding-bottom:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px;display:grid;gap:10px}
.box textarea{border:0;resize:none;min-height:60px;background:transparent;padding:4px 6px;font-size:15.5px;color:var(--t-strong);outline:none}
.box textarea::placeholder{color:var(--t-ph)}
.files{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:8px;background:var(--bg-grey);font-size:12.5px;color:var(--t)}
.fchip .k{font-size:10.5px;font-weight:700;color:var(--t-cap)}
.fchip.budget .k{color:var(--primary-text)}
.fchip button{width:20px;height:20px;border-radius:4px;color:var(--t-cap);display:grid;place-items:center}
.boxrow{display:flex;align-items:center;gap:8px}
.boxrow .sp{flex:1}
.plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--t-sub)}
.plus:hover{background:var(--hover)}
.menuwrap{position:relative}
.pick{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--t-sub)}
.pick:hover{background:var(--hover)}
.pick b{color:var(--t-strong);font-weight:500}
.pick.bordered{border:1px solid var(--line)}
.menu{position:absolute;z-index:30;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;display:grid;gap:2px}
.menu.up{bottom:calc(100% + 6px)}
.menu.down{top:calc(100% + 6px)}
.menu.right{right:0}
.menu button{display:flex;justify-content:space-between;gap:12px;height:36px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left;align-items:center}
.menu button:hover{background:var(--hover)}
.menu button[aria-checked="true"]{color:var(--primary-text);font-weight:500}
.menu small{color:var(--t-cap);font-size:12px}
.settings{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px 2px}
.examples{display:grid}
.examples button{text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--t)}
.examples button:hover{color:var(--t-strong);background:var(--hover)}

/* ---------- modal ---------- */
.dim{position:fixed;inset:0;background:var(--dim);z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(880px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-pop);padding:24px;display:grid;gap:18px}
.modal.sm{width:min(560px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh h3{margin:0;font-size:19px;font-weight:700;color:var(--t-strong)}
.mf{display:flex;justify-content:flex-end;gap:8px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop h4{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--t-strong);display:flex;gap:8px;align-items:baseline}
.drop h4 small{font-size:12px;color:var(--t-cap);font-weight:400}
.zone{border:1.5px dashed var(--line-2);border-radius:14px;padding:12px;display:grid;gap:8px;min-height:250px;align-content:start;transition:background .15s,border-color .15s}
.zone.over{background:var(--primary-weak);border-color:var(--primary-text)}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.frow .k{font-size:10.5px;font-weight:700;color:var(--t-cap);background:var(--bg-grey);border-radius:6px;padding:3px 6px}
.frow b{display:block;font-size:13.5px;font-weight:500;color:var(--t-strong);word-break:break-all}
.frow small{font-size:12px;color:var(--t-cap)}
.frow .grow{flex:1;min-width:0}
.warnbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--yel-weak);color:var(--t-strong);font-size:14px;font-weight:500}
.warnbar svg.i{color:var(--yel)}
.frow.w{flex-wrap:wrap;border-color:var(--yel-line)}
.wmsg{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-top:8px;margin-top:2px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--yel)}
.wmsg span{flex:1;min-width:160px}
.ok{font-size:11.5px;color:var(--t-cap)}
.mf .hint{margin-right:auto;align-self:center;font-size:13px;color:var(--yel)}
.fchip svg.i{width:14px;height:14px}
.fchip .wi{color:var(--yel);display:inline-grid}
.dz{display:grid;place-items:center;gap:4px;padding:28px 8px;text-align:center;border-radius:10px;color:var(--t-sub);font-size:13.5px;font-weight:500}
.dz small{color:var(--t-cap);font-weight:400;font-size:12px}
.dz:hover{background:var(--hover)}

/* ---------- B20 run ---------- */
.run{width:min(480px,100%);display:grid;gap:14px}
.run h2{margin:0;font-size:22px;color:var(--t-strong)}
.run p{margin:0;color:var(--t-sub)}
.prog{height:6px;border-radius:3px;background:var(--bg-grey);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--primary);transform-origin:left;transition:transform .4s}
.rs{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rs.wait{color:var(--t-cap)}
.rs.run em{color:var(--primary-text);font-style:normal;font-weight:500}

/* ---------- B30 review ---------- */
.docarea{flex:1;min-width:0;overflow:auto;background:var(--bg-doc);position:relative}
.docin{width:min(760px,100%);margin:0 auto;padding:20px 0 60px;display:grid;gap:14px}
.sumwrap{position:sticky;top:12px;z-index:6;height:50px;margin:0 12px}
.sum{position:absolute;inset:0 0 auto 0;background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border-radius:14px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sum>button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 18px;text-align:left}
.sum>button b{color:var(--t-strong)}
.sum>button .c{font-size:13px}
.sum>button .tog{margin-left:auto;font-size:13px;color:var(--t-cap);display:flex;gap:4px;align-items:center}
.sumov{position:absolute;inset:0;z-index:5;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);background:color-mix(in srgb,var(--bg-doc) 45%,transparent)}
.sumlist{list-style:none;margin:0;padding:0 8px 10px;display:grid}
.sumlist button{width:100%;display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;padding:9px 10px;border-radius:10px;text-align:left}
.sumlist button:hover{background:var(--hover)}
.sumlist i{width:7px;height:7px;border-radius:50%;margin-top:9px}
.sumlist .c1{color:var(--t-strong);font-size:14px}
.sumlist .c2{grid-column:2/4;font-size:12.5px;color:var(--t-cap)}
.sumlist .st{font-size:12px}
.paper{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);padding:34px 40px;margin:0 12px;font-size:15px;line-height:1.85;color:var(--t)}
.paper .crumb{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--t-cap);margin-bottom:18px}
.paper h2{font-size:18px;margin:0 0 12px;color:var(--t-strong)}
.paper p{margin:0 0 14px}
.paper table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}
.paper th,.paper td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.paper th{font-weight:500;color:var(--t-cap);font-size:13px}
.paper .n{text-align:right;font-variant-numeric:tabular-nums}
.paper .fn{font-size:12px;color:var(--t-cap)}
.paper .pgno{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t-ph);margin-top:18px}
mark{background:none;color:inherit;cursor:pointer;border-radius:3px;padding:1px 0;text-decoration:underline dashed;text-underline-offset:5px;text-decoration-thickness:1.5px}
mark.r{text-decoration-color:var(--red-line)}
mark.y{text-decoration-color:var(--yel-line)}
mark.r.on{background:var(--red-weak)}
mark.y.on{background:var(--yel-weak)}
sup.mk{font-size:10.5px;margin-left:3px;padding:1px 5px;border-radius:4px;background:var(--hover);color:var(--t-cap);vertical-align:2px}

.rpanel{width:440px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.rtop{flex:1;min-height:0;display:flex;flex-direction:column}
.rtabs{flex:none;padding:14px 18px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--bg-grey);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:8px;font-size:13.5px;color:var(--t-sub)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--t-strong);font-weight:500;box-shadow:var(--shadow-seg)}
.rlist{flex:1;min-height:0;overflow:auto;padding:4px 18px 18px}
.acc{border-bottom:1px solid var(--line)}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:14px 0;text-align:left;font-size:14.5px;font-weight:500;color:var(--t-strong)}
.acc>button .s{margin-left:auto;font-size:12.5px;font-weight:500}
.acc>button svg{color:var(--t-cap);transition:transform .15s}
.acc>button[aria-expanded="true"] svg{transform:rotate(180deg)}
.accb{padding:0 0 18px;display:grid;gap:14px}
.accb .lab{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--t-cap)}
.accb p{margin:0;font-size:14px;color:var(--t);line-height:1.65}
.quote{border-left:3px solid var(--line-2);padding:2px 0 2px 12px;font-size:14px;color:var(--t)}
.quote small{display:block;font-size:12px;color:var(--t-cap)}
.ev{display:grid;gap:4px;font-size:14px}
.ev div{display:flex;justify-content:space-between;gap:10px}
.calc{background:var(--bg-grey);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.calc .big{font-size:22px;font-weight:700;color:var(--t-strong);font-variant-numeric:tabular-nums}

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function ticks(min,max,n=4){const step=niceMax((max-min)/n);const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const out=[];for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));return out;}
const fmtAx=v=>Math.abs(v)>=10000?(v/10000).toFixed(Math.abs(v)%10000?1:0)+'만':Number.isInteger(v)?com(v):String(+v.toFixed(2));
function frame(W,H,pl,pt,pr,pb,tk,Y){return `<g class="grid">${tk.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('')}</g>${tk.map(t=>`<text x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${fmtAx(t)}</text>`).join('')}`;}
/* bars: series [{name,v,c,fade}] grouped; supports negatives */
function bars(o){const W=o.W||560,H=o.H||220,pl=44,pr=8,pt=18,pb=26,labs=o.labels,ser=o.series,n=labs.length,k=ser.length;
 const all=ser.flatMap(s=>s.v);let mn=Math.min(0,...all),mx=Math.max(0,...all);const tk=ticks(mn,mx);mn=tk[0];mx=tk[tk.length-1];
 const Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);const gw=(W-pl-pr)/n,bw=Math.min(o.bw||28,(gw-10)/k-2);
 let s=frame(W,H,pl,pt,pr,pb,tk,Y);
 labs.forEach((L,i)=>{const gx=pl+i*gw+(gw-(bw*k+2*(k-1)))/2;ser.forEach((se,j)=>{const v=se.v[i];const y0=Y(0),y1=Y(v);const last=i===n-1;
   const op=se.fade&&!last?.45:1;s+=`<rect x="${gx+j*(bw+2)}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="3" style="fill:var(${se.c});opacity:${op}" data-tip="${L} · ${se.name} ${o.fmt?o.fmt(v):com(v)}"/>`;
   if(o.labelLast&&last&&j===0)s+=`<text class="b" x="${gx+j*(bw+2)+bw/2}" y="${v>=0?y1-6:y1+14}" text-anchor="middle">${o.fmt?o.fmt(v):com(v)}</text>`;});
  s+=`<text x="${pl+i*gw+gw/2}" y="${H-8}" text-anchor="middle">${L}</text>`;});
 s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--line-2)"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${s}</svg>`;}
/* lines: series [{name,v,c,bold}] */
function lines(o){const W=o.W||560,H=o.H||220,pl=44,pr=o.pr??96,pt=18,pb=26,labs=o.labels,ser=o.series,n=labs.length;
 const all=ser.flatMap(s=>s.v);let mn=o.min??Math.min(...all),mx=o.max??Math.max(...all);const tk=ticks(mn,mx);mn=tk[0];mx=tk[tk.length-1];
 const X=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
 let s=frame(W,H,pl,pt,pr,pb,tk,Y).replace(/>(-?[\d.,만]+)</g,(m,a)=>'>'+(o.axfmt?o.axfmt(a):a)+'<');
 if(o.ref!==undefined)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" style="stroke:var(--t-cap);stroke-dasharray:4 3"/><text x="${W-pr+6}" y="${Y(o.ref)+4}">${o.refLabel||o.ref}</text>`;
 const ends=[];
 ser.forEach(se=>{const pts=se.v.map((v,i)=>[X(i),Y(v)]);s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:none;stroke:var(${se.c});stroke-width:2;stroke-linejoin:round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:3}" style="fill:var(${se.c});stroke:var(--surface);stroke-width:1.5" data-tip="${labs[i]} · ${se.name?se.name+' ':''}${o.fmt?o.fmt(se.v[i]):com(se.v[i])}"/>`;});
  ends.push({y:pts[n-1][1],t:`${se.name?se.name+' ':''}${o.fmt?o.fmt(se.v[n-1]):com(se.v[n-1])}`,bold:se.bold});});
 ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
 ends.forEach(e=>s+=`<text class="${e.bold?'b':'m'}" x="${X(n-1)+9}" y="${e.y+4}">${e.t}</text>`);

 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${s}</svg>`;}

function waterfall(o){const W=o.W||720,H=o.H||250,pl=48,pr=8,pt=24,pb=34,st=o.steps,n=st.length;let cum=0;const bars=st.map(([l,v,t])=>{let a,b;if(t){a=0;b=v;cum=v;}else{a=cum;b=cum+v;cum=b;}return {l,v,t,a,b};});
 const mx=niceMax(Math.max(...bars.map(b=>Math.max(b.a,b.b)))*1.08),tk=ticks(0,mx),top=tk[tk.length-1];const Y=v=>pt+(top-v)/top*(H-pt-pb);const gw=(W-pl-pr)/n,bw=Math.min(54,gw-18);
 let s=frame(W,H,pl,pt,pr,pb,tk,Y);
 bars.forEach((b,i)=>{const x=pl+i*gw+(gw-bw)/2,y=Math.min(Y(b.a),Y(b.b)),h=Math.max(1,Math.abs(Y(b.a)-Y(b.b)));const c=b.t?'--s1':b.v<0?'--s2':'--s3';
  s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" style="fill:var(${c})" data-tip="${b.l} ${b.t?com(b.v):(b.v>0?'+':'')+com(b.v)}억원"/>`;
  s+=`<text class="${b.t?'b':'m'}" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${b.t?com(b.v):(b.v>0?'+':'')+com(b.v)}</text>`;
  s+=`<text x="${x+bw/2}" y="${H-14}" text-anchor="middle">${b.l}</text>`;
  if(i<n-1){const yc=Y(b.t?b.v:b.b);s+=`<line x1="${x+bw}" x2="${x+gw}" y1="${yc}" y2="${yc}" style="stroke:var(--t-ph);stroke-dasharray:2 2"/>`;}});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${s}</svg>`;}

  <div class="dhead"><h2>SK텔레콤</h2><span class="sub num">017670 · 2021–2025 · DART 공시, 단위 억원</span>
   <span class="brk"></span><div class="tabs" role="tablist" aria-label="보기">${FTABS.map(([k,l])=>`<button role="tab" aria-selected="${S.ftab===k}" data-act="ftab" data-v="${k}">${l}</button>`).join('')}</div>
   <div class="ctl"><div class="seg" role="radiogroup" aria-label="기준"><button aria-pressed="${S.scope==='skb'}" data-act="scope" data-v="skb">SKB 포함</button><button aria-pressed="${S.scope==='skt'}" data-act="scope" data-v="skt">SKT 단독</button></div>
    <div class="seg" role="radiogroup" aria-label="기간"><button aria-pressed="${S.period==='y'}" data-act="period" data-v="y">연간</button><button aria-pressed="${S.period==='q'}" data-act="period" data-v="q">분기</button></div></div></div>
  ${t[2]()}
 </div>${fInput()}</div>`);}

/* ================= I20 인사이트 답변 ================= */
function vI20(){const cx=D.capex.skt;
 return shell(`<header class="hdr"><h1>SK텔레콤 <span style="font-size:13px;font-weight:400;color:var(--t-cap)" class="num">017670</span></h1><div class="r"><span class="tag p">인사이트</span></div></header>
 <div class="fwrap"><div class="dash" id="dash"><div class="conv">
  <div class="bub">SKT CapEx가 2년 동안 줄어든 이유는?</div>
  <div class="para">SKT 단독 CapEx는 2023년 1조 7,430억원에서 2025년 1조 2,440억원으로 2년 동안 28.6% 줄었어요 [1].<div class="tags">${tg('공시')}${tg('계산')}</div></div>
  <div class="srcgrid">${card('','[1] CapEx (SKT 단독)','공시',bars({W:420,H:200,labels:['2023','2024','2025'],series:[{name:'CapEx',v:cx.slice(2),c:'--s1',fade:1}],labelLast:1,bw:48,aria:'CapEx 3년'}))}
   ${card('','[1] 전년 대비','계산',`<div class="tbl"><table class="ftbl" style="min-width:0"><thead><tr><th></th><th class="n">2024</th><th class="n">2025</th></tr></thead><tbody><tr><td>증감</td><td class="n">−11.4%</td><td class="n">−19.4%</td></tr><tr class="b"><td>2년 누적</td><td class="n"></td><td class="n">−28.6%</td></tr></tbody></table></div>`)}</div>
  <div class="srcline">출처: SKT 2025 사업보고서 II-3-라, 61쪽 (공시 2026-03-17), SKT 2024 사업보고서 (공시 2025-03-18). 증감은 계산 값.</div>
  <div class="para">사업보고서는 감소 이유를 "5G 투자가 안정화 단계에 들어섰기 때문"이라고 설명해요. 같은 기간 감가상각비도 줄어 대규모 5G 설비 투자가 끝나 가는 흐름과 맞아요 [2]. 다만 2026년 투자 계획 금액은 공시에 없어요.<div class="tags">${tg('공시')}${tg('AI')}</div></div>
  ${card('','[2] 유형자산 감가상각비 (2021–2025)','SKB 포함',ftable(YR,[['SKT',D.cons.ppeDep]],'억원'))}
  <div class="srcline">출처: SKT 사업보고서 2021~2025, DART</div>
  ${S.i20extra.map(q=>`<div class="bub">${esc(q)}</div><div class="para" style="color:var(--t-sub)">데모에는 CapEx 질문의 답변만 들어 있어요. 아래 이어서 물어보기나 인사이트 대시보드의 차트에서 질문해 보세요.</div>`).join('')}
  <div class="sugg"><p>이어서 물어보기</p>${['KT, LG유플러스의 같은 기간 CapEx는 얼마인가요?','감가상각비 감소가 영업이익에 준 영향은?','AI 데이터센터 투자는 어느 공시에 나오나요?'].map(s=>`<button data-act="sugg" data-v="${esc(s)}">${s}</button>`).join('')}</div>
 </div></div>${fInput()}</div>`);}

/* ================= router ================= */
const VIEWS={login:vLogin,b10:vB10,b20:vB20,b30:vB30,b40:vB40,b50:vB50,b60:vB60,b61:vB61,i10:vI10,i20:vI20};
let authed=false;
function render(keep){const sc=keep?[...document.querySelectorAll('.scroll,.docarea,.rlist,.dash')].map(e=>e.scrollTop):null;
 root.innerHTML=VIEWS[S.route]();
 if(sc)[...document.querySelectorAll('.scroll,.docarea,.rlist,.dash')].forEach((e,i)=>{if(sc[i]!==undefined)e.scrollTop=sc[i];});
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;}
function go(r){if(location.hash.slice(1)===r)onHash();else location.hash=r;}
function onHash(){let r=location.hash.slice(1);if(!VIEWS[r])r=authed?'b10':'login';if(!authed&&r!=='login')r='login';
 S.route=r;S.menu=null;S.modal=null;S.sideOpen=false;if(r==='b20')startRun();if(r==='b30'&&S.tab==='q'&&!S.openQ)S.openQ='q1';render();window.scrollTo(0,0);}
window.addEventListener('hashchange',onHash);
let runT;function startRun(){S.progress=0;clearInterval(runT);runT=setInterval(()=>{S.progress++;if(S.route!=='b20'){clearInterval(runT);return;}if(S.progress>=4){clearInterval(runT);setTimeout(()=>{if(S.route==='b20')go('b30');},500);}render();},800);}

/* ================= events ================= */
const SAMPLE={budget:{n:'SKT_2025_사업보고서.html',m:'214쪽'},ev:[{n:'SKT_2025_4Q_실적발표.pdf',m:'18쪽'},{n:'SKT_네트워크_투자내역.xlsx',m:'3시트'},{n:'KT_2025_사업보고서.html',m:'198쪽'},{n:'SKT_2026_1Q_실적발표.pdf',m:'16쪽'}]};
/* 자료 점검: 회사 불일치, 기준 시점(2026-03-17) 이후, 예산서 형식. 데모는 파일명으로 판단 */
function checkFile(f,zone){const n=f.n,ext=(n.split('.').pop()||'').toLowerCase();
 if(zone==='b'&&!['pdf','html','htm'].includes(ext))return {t:'fmt',m:'예산서는 PDF, HTML만 받아요'};
 const co=/(^|[_\s])KT[_\s]/i.test(n)?'KT':/LG|LGU|유플러스/i.test(n)?'LG유플러스':null;if(co&&co!==S.co)return {t:'co',m:`회사가 달라요. ${co} 자료예요 (선택한 회사 ${S.co})`};
 const q=n.match(/(20\d\d)_?([1-4])Q/i);if(q&&(+q[1]>2026||(+q[1]===2026&&+q[2]>=1)))return {t:'date',m:'기준 시점(2026-03-17) 이후 자료예요. 예측 평가가 공정하지 않아요'};
 return null;}
function withWarn(f,zone){const w=checkFile(f,zone);return {...f,w,keep:false};}
const pending=d=>[d.budget?['b',d.budget]:null,...d.ev.map(e=>['e',e])].filter(x=>x&&x[1].w&&!x[1].keep).length;
function addFiles(k,list){const arr=[...list].map(f=>withWarn({n:f.name,m:Math.max(1,Math.round(f.size/1024))+'KB'},k));if(!arr.length)return;
 if(k==='b')S.draft.budget=arr[0];else S.draft.ev.push(...arr);render(true);}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(g.dataset.go==='login')authed=false;go(g.dataset.go);return;}
 const t=e.target.closest('[data-toc]');if(t){const el=document.getElementById(t.dataset.toc);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
 const a=e.target.closest('[data-act]');
 if(!a){if(S.menu&&!e.target.closest('.menu')){S.menu=null;render(true);}return;}
 const k=a.dataset.k,v=a.dataset.v,act=a.dataset.act;
 if(act==='dimClose'){if(e.target===a){S.modal=null;render(true);}return;}
 switch(act){
  case 'side':S.sideOpen=!S.sideOpen;render(true);break;
  case 'ktSession':toast('KT 2025 4Q 예산서는 아직 분석 결과가 없어요');break;
  case 'menu':S.menu=S.menu===a.dataset.m?null:a.dataset.m;render(true);break;
  case 'pick':{if(a.disabled)return;const m=a.dataset.m;if(m==='model')S.model=v;if(m==='co')S.co=v;if(m==='dept')S.dept=v;if(m==='qtr')S.qtr=v;S.menu=null;if(m==='model')toast(v==='로컬 LLM'?'로컬 LLM으로만 분석해요':'범용 LLM으로 분석해요');render(true);break;}
  case 'example':S.prompt=v;render(true);$('#prompt')?.focus();break;
  case 'openB11':S.prompt=$('#prompt')?.value||S.prompt;S.draft=S.attached?{budget:S.files.budget,ev:[...S.files.ev]}:{budget:withWarn(SAMPLE.budget,'b'),ev:SAMPLE.ev.map(e=>withWarn(e,'e'))};S.modal='b11';render(true);break;
  case 'closeModal':S.modal=null;render(true);break;
  case 'pickFile':$(k==='b'?'#fileB':'#fileE').click();break;
  case 'rmEv':S.draft.ev.splice(+a.dataset.i,1);render(true);break;
  case 'rmB':S.draft.budget=null;render(true);break;
  case 'keepWarn':{const it=k==='b'?S.draft.budget:S.draft.ev[+a.dataset.i];it.keep=true;render(true);break;}
  case 'attach':S.files={budget:S.draft.budget,ev:[...S.draft.ev]};S.attached=true;S.modal=null;render(true);break;
  case 'rmChip':if(k==='b')S.files.budget=null;else S.files.ev.splice(+k,1);render(true);break;
  case 'start':S.prompt=$('#prompt')?.value||S.prompt;go('b20');break;
  case 'sum':S.sumOpen=!S.sumOpen;render(true);break;
  case 'sumGo':S.sumOpen=false;selectMark(k);break;
  case 'mark':selectMark(k);break;
  case 'tab':S.tab=v;render(true);break;
  case 'accA':S.openA=S.openA===k?null:k;S.mark=S.openA?Object.keys(MARKS).find(m=>MARKS[m].a===k):null;render(true);break;
  case 'accQ':S.openQ=S.openQ===k?null:k;S.mark=S.openQ?Object.keys(MARKS).find(m=>MARKS[m].q===k):null;render(true);break;
  case 'promptTog':S.promptOpen[k]=!S.promptOpen[k];render(true);break;
  case 'copy':{const txt=QUESTIONS[k].prompt;const ok=()=>toast('프롬프트를 복사했어요');
   (navigator.clipboard?.writeText(txt)||Promise.reject()).then(ok).catch(()=>{const p=$('#pr-'+k);if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast('프롬프트를 선택했어요. 복사해서 쓰세요');});break;}
  case 'chat':S.chat=!S.chat;render(true);if(S.chat)$('#chatIn')?.focus();break;
  case 'jump':selectMark(k);go('b30');break;
  case 'openB41':S.modal='b41';render(true);break;
  case 'exAll':S.ex.sel=S.ex.sel.length===7?[]:['a1','a2','a3','q1','q2','q3','q4'];render(true);break;
  case 'exItem':{const i=S.ex.sel.indexOf(k);if(i<0)S.ex.sel.push(k);else S.ex.sel.splice(i,1);render(true);break;}
  case 'exFmt':S.ex.fmt=v;render(true);break;
  case 'doExport':S.modal=null;render(true);toast(`항목 ${S.ex.sel.length}개를 ${S.ex.fmt}로 내보냈어요 (데모에서는 파일을 받지 않아요)`);break;
  case 'exp':S.exp=S.exp===+a.dataset.i?null:+a.dataset.i;render(true);break;
  case 'verdict':if(+a.dataset.i===3)S.q4=v;else toast('데모에서는 Q4 판정만 바꿀 수 있어요');render(true);break;
  case 'addRow':S.addRow=!S.addRow;render(true);if(S.addRow)$('#nr1')?.focus();break;
  case 'saveRow':{const b=$('#nr1').value.trim(),i=$('#nr2').value.trim();if(!i){toast('쟁점을 적어 주세요');return;}S.extraRows.unshift([b||'증권사 미입력',i]);S.addRow=false;render(true);toast('쟁점을 추가했어요');break;}
  case 'editCrit':S.editCrit=true;render(true);$('#crit')?.focus();break;
  case 'saveCrit':S.crit=$('#crit').value;S.editCrit=false;render(true);toast('판정 기준을 저장했어요');break;
  case 'confirm':toast('판정을 확정했어요');S.exp=null;render(true);break;
  case 'ftab':S.ftab=v;render();$('#dash').scrollTop=0;break;
  case 'scope':S.scope=v;render(true);break;
  case 'period':S.period=v;if(v==='q'&&!['over','pl'].includes(S.ftab))toast('분기 보기는 한눈에, 손익 탭의 매출·영업이익에 적용돼요');render(true);break;
  case 'ask':S.fq=`${a.dataset.t} 기준으로 설명해 주세요`;render(true);const q=$('#fq');q.focus();q.setSelectionRange(q.value.length,q.value.length);break;
  case 'sugg':S.i20extra.push(v);render(true);const d=$('#dash');d.scrollTop=d.scrollHeight;break;
 }});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.modal){S.modal=null;render(true);}else if(S.menu){S.menu=null;render(true);}else if(S.chat&&S.route!=='i10'){S.chat=false;render(true);}else if(S.sumOpen){S.sumOpen=false;render(true);}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('mark[data-act],tr[data-act]')){e.preventDefault();e.target.click();}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
 if(f==='login'){authed=true;go('b10');}
 if(f==='chat'){const inp=e.target.querySelector('input'),q=inp.value.trim();if(!q)return;const key=e.target.dataset.k;S.chatLog[key].push(['u',q],['a','데모 챗봇은 미리 준비한 답만 보여 줘요. 실제 서비스에서는 이 화면의 분석 결과와 공시 데이터로 답해요.']);render(true);$('#chatIn')?.focus();}
 if(f==='fask'){const q=$('#fq').value.trim();if(!q){toast('질문을 적어 주세요');return;}S.fq='';if(S.route==='i20'){S.i20extra.push(q);render(true);const d=$('#dash');d.scrollTop=d.scrollHeight;}else{if(!/capex/i.test(q))S.i20extra=[q];else S.i20extra=[];go('i20');}}});
document.addEventListener('input',e=>{if(e.target.id==='prompt')S.prompt=e.target.value;if(e.target.id==='fq')S.fq=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='fileB')addFiles('b',e.target.files);if(e.target.id==='fileE')addFiles('e',e.target.files);});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-zone]');if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-zone]');if(z)z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-zone]');if(z){e.preventDefault();addFiles(z.dataset.zone,e.dataTransfer.files);}});
function selectMark(k){const m=MARKS[k];S.mark=k;if(m.a){S.tab='a';S.openA=m.a;}else{S.tab='q';S.openQ=m.q;}if(m.a&&m.q&&S.tab==='a'&&S.lastMark===k){S.tab='q';S.openQ=m.q;}S.lastMark=k;render(true);
 const el=document.querySelector(`mark[data-k="${k}"]`);el?.scrollIntoView({block:'center',behavior:'smooth'});}
/* tooltip */
const tip=$('#tip');
document.addEventListener('pointermove',e=>{const m=e.target.closest&&e.target.closest('[data-tip]');if(!m){tip.hidden=true;return;}tip.textContent=m.dataset.tip;tip.hidden=false;
 const w=tip.offsetWidth;let x=e.clientX+12;if(x+w>innerWidth-8)x=e.clientX-w-12;tip.style.left=x+'px';tip.style.top=(e.clientY-36)+'px';});
document.addEventListener('pointerleave',()=>tip.hidden=true);
onHash();
</script>
