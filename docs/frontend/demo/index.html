<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telescope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Hallmark · shape: app screen · genre: product tool · theme: TDS + SKT 보라 (user named, by request) · posture: restrained · copy: verbatim · states: 8 · contrast: pass */
/* Layout: 왼쪽 사이드바 + 작업 영역. TDS 원칙(면과 여백으로 구분, fill/weak 버튼, 쿨그레이 글자)에 SKT 보라를 주색으로. */
:root{
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bg:#FFFFFF; --bg-grey:#F2F4F6; --bg-doc:#ECEEF2; --surface:#FFFFFF; --side:#F9FAFB;
  --line:#E5E8EB; --line-2:#D1D6DB; --hover:rgba(2,32,71,.05);
  --t-strong:#191F28; --t:#333D4B; --t-sub:#4E5968; --t-cap:#6B7684; --t-ph:#8B95A1;
  --primary:#3617CE; --primary-press:#2A10A8; --primary-text:#3617CE; --primary-weak:rgba(54,23,206,.09); --on-primary:#FFFFFF;
  --red:#D22030; --red-weak:rgba(240,68,82,.13); --red-line:#E42939;
  --yel:#8A5A00; --yel-weak:rgba(255,195,66,.30); --yel-line:#D99A00;
  --green:#027A4A; --green-weak:rgba(3,178,108,.12);
  --s1:#6250D6; --s2:#EB6834; --s3:#1BAF7A; --s4:#EDA100;
  --dim:rgba(0,0,0,.5); --shadow:0 2px 10px rgba(0,27,55,.08); --shadow-pop:0 12px 40px rgba(0,0,0,.18);
  --shadow-seg:0 1px 2px rgba(0,0,0,.09); --r-sm:8px; --r-md:10px; --r-lg:14px;
  /* v04: 인사이트(해석) 면 */
  --ai-bg:#F4F1FF; --ai-weak:rgba(98,80,214,.09); --ai-text:#4B37C9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141418; --bg-grey:#1B1B21; --bg-doc:#101014; --surface:#1E1E25; --side:#18181D;
  --line:#2C2C35; --line-2:#3A3A45; --hover:rgba(255,255,255,.06);
  --t-strong:#F2F2F6; --t:#DADAE2; --t-sub:#B4B4C0; --t-cap:#9696A4; --t-ph:#76768A;
  --primary:#6A55F2; --primary-press:#5A44E6; --primary-text:#A99BFF; --primary-weak:rgba(140,123,255,.16); --on-primary:#FFFFFF;
  --red:#FF8A8F; --red-weak:rgba(240,68,82,.20); --red-line:#FF6B72;
  --yel:#F5C451; --yel-weak:rgba(255,195,66,.18); --yel-line:#E8B23A;
  --green:#4FD39A; --green-weak:rgba(3,178,108,.18);
  --s1:#9085E9; --s2:#D95926; --s3:#199E70; --s4:#C98500;
  --dim:rgba(0,0,0,.62); --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-pop:0 12px 40px rgba(0,0,0,.5);
  --ai-bg:#1A1828; --ai-weak:rgba(140,123,255,.14); --ai-text:#B9AEFF;
  color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#141418; --bg-grey:#1B1B21; --bg-doc:#101014; --surface:#1E1E25; --side:#18181D;
  --line:#2C2C35; --line-2:#3A3A45; --hover:rgba(255,255,255,.06);
  --t-strong:#F2F2F6; --t:#DADAE2; --t-sub:#B4B4C0; --t-cap:#9696A4; --t-ph:#76768A;
  --primary:#6A55F2; --primary-press:#5A44E6; --primary-text:#A99BFF; --primary-weak:rgba(140,123,255,.16); --on-primary:#FFFFFF;
  --red:#FF8A8F; --red-weak:rgba(240,68,82,.20); --red-line:#FF6B72;
  --yel:#F5C451; --yel-weak:rgba(255,195,66,.18); --yel-line:#E8B23A;
  --green:#4FD39A; --green-weak:rgba(3,178,108,.18);
  --s1:#9085E9; --s2:#D95926; --s3:#199E70; --s4:#C98500;
  --dim:rgba(0,0,0,.62); --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-pop:0 12px 40px rgba(0,0,0,.5);
  --ai-bg:#1A1828; --ai-weak:rgba(140,123,255,.14); --ai-text:#B9AEFF;
  color-scheme:dark}
html,body{height:100%;overflow-x:clip}
#root{height:100%}
body{margin:0;background:var(--bg);color:var(--t);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- buttons (TDS fill / weak) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r-md);font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s}
.btn.sm{height:32px;padding:0 12px;border-radius:var(--r-sm);font-size:13px}
.btn.lg{height:48px;padding:0 20px;border-radius:var(--r-lg);font-size:16px}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.fill:hover{background:var(--primary-press)}
.btn:active:not(:disabled),.icon-btn:active,.pick:active{transform:scale(.98)}
.btn.fill:disabled{background:var(--line);color:var(--t-sub);cursor:not-allowed}
.btn.weak{background:var(--primary-weak);color:var(--primary-text)}
.btn.grey{background:var(--hover);color:var(--t-sub)}
.btn.grey:hover,.btn.weak:hover{filter:brightness(.97)}
.btn.line{border:1px solid var(--line);background:var(--surface);color:var(--t)}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--t-sub)}
.icon-btn:hover{background:var(--hover)}
.icon-btn[aria-pressed="true"]{background:var(--primary-weak);color:var(--primary-text)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:500;background:var(--hover);color:var(--t-sub);white-space:nowrap;vertical-align:1px}
.tag.p{background:var(--primary-weak);color:var(--primary-text)}
.st-bad{color:var(--red);font-weight:700}
.st-q{color:var(--yel);font-weight:700}
.st-ok{color:var(--green);font-weight:700}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;background:var(--bg-grey);padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{width:min(400px,100%);background:var(--surface);border-radius:20px;padding:36px 32px;display:grid;gap:18px;box-shadow:var(--shadow)}
.login .brand{font-size:24px;font-weight:700;color:var(--t-strong);letter-spacing:-.01em}
.login .brand small{display:block;font-size:14px;font-weight:400;color:var(--t-sub);margin-top:4px;letter-spacing:0}
.field{display:grid;gap:6px;font-size:13px;color:var(--t-sub)}
.inp{height:48px;border-radius:12px;border:0;background:var(--bg-grey);padding:0 14px;font-size:15px;color:var(--t-strong)}
.inp:focus{outline:2px solid var(--primary-text);outline-offset:0}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;gap:18px;min-height:0;overflow:auto}
.logo{text-align:left;align-self:start;font-size:18px;font-weight:700;color:var(--t-strong);padding:2px 8px;letter-spacing:-.01em}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--r-sm);font-size:14px;color:var(--t);text-align:left;width:100%}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--hover);color:var(--t-strong);font-weight:500}
.grp{display:grid;gap:2px}
.grp>p{margin:0 0 4px;padding:0 10px;font-size:12px;color:var(--t-cap);display:flex;align-items:center;gap:6px}
.grp>p .dot{width:6px;height:6px;border-radius:50%;background:var(--t-ph)}
.grp>p .dot.p{background:var(--primary-text)}
.grp button{height:34px;padding:0 10px;border-radius:var(--r-sm);font-size:14px;text-align:left;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp button:hover{background:var(--hover)}
.grp button[aria-current="page"]{background:var(--hover);color:var(--t-strong);font-weight:500}
.step{display:flex!important;align-items:center;gap:10px}
.step .n{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--t-strong);color:var(--bg)}
.step .d{margin-left:auto;font-size:11.5px;color:var(--t-cap)}
.step[aria-current="step"]{background:var(--hover);font-weight:500;color:var(--t-strong)}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.user .av{width:30px;height:30px;border-radius:50%;background:var(--line)}
.user b{display:block;font-size:13.5px;color:var(--t-strong);font-weight:500;line-height:1.3}
.user small{font-size:12px;color:var(--t-cap)}
.user button{margin-left:auto;font-size:12px;color:var(--t-cap)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.mobilebar{display:none}

.hdr{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:var(--bg);position:relative;z-index:5}
/* v05: 고정 헤더 아래 선 대신 그라데이션 블러 */
.hdr::after,.dhead::after,.dtop::after,.topbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:24px;pointer-events:none;background:linear-gradient(var(--bg),transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.hdr h1{margin:0;font-size:17px;font-weight:700;color:var(--t-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
@media (max-width:1180px){.hdr .ctr{position:static;transform:none}}
.hdr .r{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--bg-grey);font-size:12.5px;color:var(--t-sub);white-space:nowrap}
.chip b{color:var(--t-strong);font-weight:500}
.body{flex:1;min-height:0;display:flex}
.scroll{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.scroll>*{flex:none}
.scroll>.hero{flex:1 0 auto}

/* ---------- B10 new analysis ---------- */
.hero{display:grid;place-items:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.compose{width:min(760px,100%);display:grid;gap:28px}
.compose h2{margin:0;text-align:center;font-size:26px;line-height:1.35;font-weight:700;color:var(--t-strong);letter-spacing:-.01em;text-wrap:balance}
.tray{background:var(--bg-grey);border-radius:20px;padding-bottom:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px;display:grid;gap:10px}
.box textarea{border:0;resize:none;min-height:60px;background:transparent;padding:4px 6px;font-size:15.5px;color:var(--t-strong);outline:none}
.box textarea::placeholder{color:var(--t-ph)}
.files{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:8px;background:var(--bg-grey);font-size:12.5px;color:var(--t)}
.fchip .k{font-size:10.5px;font-weight:700;color:var(--t-cap)}
.fchip.budget .k{color:var(--primary-text)}
.fchip button{width:20px;height:20px;border-radius:4px;color:var(--t-cap);display:grid;place-items:center}
.boxrow{display:flex;align-items:center;gap:8px}
.boxrow .sp{flex:1}
.plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--t-sub)}
.plus:hover{background:var(--hover)}
.menuwrap{position:relative}
.pick{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--t-sub)}
.pick:hover{background:var(--hover)}
.pick b{color:var(--t-strong);font-weight:500}
.pick.bordered{border:1px solid var(--line)}
.menu{position:absolute;z-index:30;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;display:grid;gap:2px}
.menu.up{bottom:calc(100% + 6px)}
.menu.down{top:calc(100% + 6px)}
.menu.right{right:0}
.menu button{display:flex;justify-content:space-between;gap:12px;height:36px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left;align-items:center}
.menu button:hover{background:var(--hover)}
.menu button[aria-checked="true"]{color:var(--primary-text);font-weight:500}
.menu small{color:var(--t-cap);font-size:12px}
.settings{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px 2px}
.examples{display:grid}
.examples button{text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--t)}
.examples button:hover{color:var(--t-strong);background:var(--hover)}

/* ---------- modal ---------- */
.dim{position:fixed;inset:0;background:var(--dim);z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(880px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-pop);padding:24px;display:grid;gap:18px}
.modal.sm{width:min(560px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh h3{margin:0;font-size:19px;font-weight:700;color:var(--t-strong)}
.mf{display:flex;justify-content:flex-end;gap:8px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop h4{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--t-strong);display:flex;gap:8px;align-items:baseline}
.drop h4 small{font-size:12px;color:var(--t-cap);font-weight:400}
.zone{border:1.5px dashed var(--line-2);border-radius:14px;padding:12px;display:grid;gap:8px;min-height:250px;align-content:start;transition:background .15s,border-color .15s}
.zone.over{background:var(--primary-weak);border-color:var(--primary-text)}
/* 업로드 안내는 칸의 남은 공간 가운데(가로·세로) */
.drop .zone{display:flex;flex-direction:column}
.drop .zone>.dz{flex:1;align-content:center}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.frow .k{font-size:10.5px;font-weight:700;color:var(--t-cap);background:var(--bg-grey);border-radius:6px;padding:3px 6px}
.frow b{display:block;font-size:13.5px;font-weight:500;color:var(--t-strong);word-break:break-all}
.frow small{font-size:12px;color:var(--t-cap)}
.frow .grow{flex:1;min-width:0}
.warnbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--yel-weak);color:var(--t-strong);font-size:14px;font-weight:500}
.warnbar svg.i{color:var(--yel)}
.frow.w{flex-wrap:wrap;border-color:var(--yel-line)}
.wmsg{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-top:8px;margin-top:2px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--yel)}
.wmsg span{flex:1;min-width:160px}
.ok{font-size:11.5px;color:var(--t-cap)}
.mf .hint{margin-right:auto;align-self:center;font-size:13px;color:var(--yel)}
.fchip svg.i{width:14px;height:14px}
.fchip .wi{color:var(--yel);display:inline-grid}
.dz{display:grid;place-items:center;gap:4px;padding:28px 8px;text-align:center;border-radius:10px;color:var(--t-sub);font-size:13.5px;font-weight:500}
.dz small{color:var(--t-cap);font-weight:400;font-size:12px}
.dz:hover{background:var(--hover)}

/* ---------- B20 run ---------- */
.run{width:min(480px,100%);display:grid;gap:14px}
.run h2{margin:0;font-size:22px;color:var(--t-strong)}
.run p{margin:0;color:var(--t-sub)}
.prog{height:6px;border-radius:3px;background:var(--bg-grey);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--primary);transform-origin:left;transition:transform .4s}
.rs{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rs.wait{color:var(--t-cap)}
.rs.run em{color:var(--primary-text);font-style:normal;font-weight:500}

/* ---------- B30 review ---------- */
.docarea{flex:1;min-width:0;overflow:auto;background:var(--bg-doc);position:relative}
.docin{width:min(760px,100%);margin:0 auto;padding:20px 0 160px;display:grid;gap:14px}
.sumwrap{position:sticky;top:12px;z-index:6;height:50px;margin:0 12px}
.sum{position:absolute;inset:0 0 auto 0;background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border-radius:14px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sum>button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 18px;text-align:left}
.sum>button b{color:var(--t-strong)}
.sum>button .c{font-size:13px}
.sum>button .tog{margin-left:auto;font-size:13px;color:var(--t-cap);display:flex;gap:4px;align-items:center}
.sumov{position:absolute;inset:0;z-index:5;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);background:color-mix(in srgb,var(--bg-doc) 45%,transparent)}
.sumlist{list-style:none;margin:0;padding:0 8px 10px;display:grid}
.sumlist button{width:100%;display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;padding:9px 10px;border-radius:10px;text-align:left}
.sumlist button:hover{background:var(--hover)}
.sumlist i{width:7px;height:7px;border-radius:50%;margin-top:9px}
.sumlist .c1{color:var(--t-strong);font-size:14px}
.sumlist .c2{grid-column:2/4;font-size:12.5px;color:var(--t-cap)}
.sumlist .st{font-size:12px}
.paper{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);padding:34px 40px;margin:0 12px;font-size:15px;line-height:1.85;color:var(--t)}
.paper .crumb{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--t-cap);margin-bottom:18px}
.paper h2{font-size:18px;margin:0 0 12px;color:var(--t-strong)}
.paper p{margin:0 0 14px}
.paper table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}
.paper th,.paper td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.paper th{font-weight:500;color:var(--t-cap);font-size:13px}
.paper .n{text-align:right;font-variant-numeric:tabular-nums}
.paper .fn{font-size:12px;color:var(--t-cap)}
.paper .pgno{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t-ph);margin-top:18px}
mark{background:none;color:inherit;cursor:pointer;border-radius:3px;padding:1px 0;text-decoration:underline dashed;text-underline-offset:5px;text-decoration-thickness:1.5px}
mark.r{text-decoration-color:var(--red-line)}
mark.y{text-decoration-color:var(--yel-line)}
mark.r.on{background:var(--red-weak)}
mark.y.on{background:var(--yel-weak)}
sup.mk{font-size:10.5px;margin-left:3px;padding:1px 5px;border-radius:4px;background:var(--hover);color:var(--t-cap);vertical-align:2px}

.rpanel{width:440px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.rtop{flex:1;min-height:0;display:flex;flex-direction:column}
.rtabs{flex:none;padding:14px 18px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--bg-grey);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:8px;font-size:13.5px;color:var(--t-sub)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--t-strong);font-weight:500;box-shadow:var(--shadow-seg)}
.rlist{flex:1;min-height:0;overflow:auto;padding:4px 18px 18px}
.acc{border-bottom:1px solid var(--line)}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:14px 0;text-align:left;font-size:14.5px;font-weight:500;color:var(--t-strong)}
.acc>button .s{margin-left:auto;font-size:12.5px;font-weight:500}
.acc>button svg{color:var(--t-cap);transition:transform .15s}
.acc>button[aria-expanded="true"] svg{transform:rotate(180deg)}
.accb{padding:0 0 18px;display:grid;gap:14px}
.accb .lab{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--t-cap)}
.accb p{margin:0;font-size:14px;color:var(--t);line-height:1.65}
.quote{border-left:3px solid var(--line-2);padding:2px 0 2px 12px;font-size:14px;color:var(--t)}
.quote small{display:block;font-size:12px;color:var(--t-cap)}
.ev{display:grid;gap:4px;font-size:14px}
.ev div{display:flex;justify-content:space-between;gap:10px}
.calc{background:var(--bg-grey);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.calc .big{font-size:22px;font-weight:700;color:var(--t-strong);font-variant-numeric:tabular-nums}
.calc .f{font-size:12.5px;color:var(--t-cap);font-variant-numeric:tabular-nums}
.prompt{background:var(--bg-grey);border-radius:12px}
.prompt>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--t-strong)}
.prompt>button svg{color:var(--t-cap);transition:transform .15s}
.prompt>button[aria-expanded="true"] svg{transform:rotate(180deg)}
.prompt .pb{padding:0 14px 12px;display:grid;gap:6px}
.prompt .pb p{font-size:13.5px;color:var(--t-sub)}
.prompt .pb .icon-btn{justify-self:end;width:30px;height:30px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.rpanel .chat{height:50%;flex:none;border-top:1px solid var(--line)}
.chatside{width:400px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chatside .chat{flex:1}
.chh{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line)}
.chh b{font-size:14.5px;color:var(--t-strong)}
.chh svg.i{color:var(--t-strong)}
.chh .icon-btn{margin-left:auto}
.msgs{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.msgs .inner{display:flex;flex-direction:column;gap:14px}
.bub{align-self:flex-end;justify-self:end;width:fit-content;max-width:min(560px,85%);background:var(--bg-grey);color:var(--t-strong);padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.55}
.ans{font-size:14px;line-height:1.7;color:var(--t)}
.ans .src{display:block;margin-top:4px;font-size:12px;color:var(--t-cap)}
.cin{flex:none;margin:0 14px 14px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;background:var(--surface)}
.cin input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--t-strong);height:34px}
.cin input::placeholder{color:var(--t-ph)}
.send{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}

/* ---------- reports ---------- */
/* 보고서: 세션 제목(헤더) 왼쪽 여백 40px, 목차 왼쪽 끝도 같은 40px. 본문은 남은 칸 가운데 */
.hdr.rp{padding:0 24px 0 40px}
.rep{display:grid;grid-template-columns:180px minmax(0,1fr);gap:40px;padding:36px 40px 160px}
.rep>.doc{width:100%;max-width:760px;margin:0 auto}
.rep.wide>.doc{max-width:860px}
.toc{position:sticky;top:36px;align-self:start;display:grid;gap:4px;font-size:13.5px}
.toc p{margin:0 0 6px;font-size:12px;color:var(--t-cap)}
.toc button{text-align:left;padding:4px 0;color:var(--t-sub)}
.toc button:hover,.toc button[aria-current="true"]{color:var(--t-strong)}
.toc button[aria-current="true"]{font-weight:700}
.doc{min-width:0}
.doc h1{margin:0;font-size:28px;line-height:1.35;color:var(--t-strong);letter-spacing:-.01em}
.dtop{position:sticky;top:0;z-index:4;background:var(--bg);margin:-36px 0 0;padding:36px 0 2px}
.dtop+*{margin-top:40px}
.dtop .meta h1{margin:0}
.dtop .meta{margin-bottom:14px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 26px;font-size:13px;color:var(--t-cap)}
.doc h2{font-size:20px;margin:36px 0 12px;color:var(--t-strong);scroll-margin-top:150px}
.doc h3{font-size:16px;margin:24px 0 8px;color:var(--t-strong)}
.doc p{margin:0 0 12px;line-height:1.8}
.tbl{overflow-x:auto;margin:8px 0 14px}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
.tbl th{font-weight:500;font-size:12.5px;color:var(--t-cap);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl tr.exp td{background:var(--bg-grey)}
.dl{display:grid;grid-template-columns:130px 1fr;border-top:1px solid var(--line);margin:4px 0 8px}
.dl dt,.dl dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl dt{color:var(--t-cap)}
.link{color:var(--primary-text);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.fix{margin:0;padding-left:20px;display:grid;gap:6px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--t-cap)}
.qa{margin:30px 0 0}
.qa .no{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.qa .no b{color:var(--ai-text)}
.qa .qt{font-size:16.5px;font-weight:500;color:var(--t-strong);line-height:1.6;margin-bottom:10px}
.vt{display:inline-flex;gap:4px}
.vt button{height:30px;padding:0 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.vt button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.v-hit{color:var(--green);font-weight:700}.v-part{color:var(--yel);font-weight:700}.v-miss{color:var(--red);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--primary)}

/* ---------- F10 dashboard ---------- */
.fwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.dash{flex:1;min-height:0;overflow:auto;padding-block:0 140px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:0 0 16px;padding:14px 0 14px;position:sticky;top:0;z-index:8;background:var(--bg)}
.dhead h2{margin:0;font-size:22px;color:var(--t-strong)}
.dhead .sub{font-size:13px;color:var(--t-cap)}
.dhead .ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dhead .tabs{order:3;flex-basis:100%;width:max-content;max-width:100%}
.dhead .tabs{flex-basis:auto}
.dhead .brk{order:2;flex-basis:100%;height:0}
.dhead .ctl{order:1}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--bg-grey);border-radius:10px;padding:3px;max-width:100%}
.tabs button{height:30px;padding:0 14px;border-radius:8px;font-size:13.5px;color:var(--t-sub);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--t-strong);font-weight:500;box-shadow:var(--shadow-seg)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ch h3{margin:0;font-size:14.5px;font-weight:700;color:var(--t-strong)}
.ch .ask{margin-left:auto;font-size:12.5px;color:var(--t-cap);padding:2px 6px;border-radius:6px}
.ch .ask:hover{color:var(--primary-text);background:var(--primary-weak)}
.cap{font-size:12px;color:var(--t-cap);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--t-sub);margin:-2px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.kpi .l{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t-sub)}
.kpi .l svg{margin-left:auto}
.kpi .v{font-size:22px;font-weight:700;color:var(--t-strong);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .d{font-size:12px;color:var(--t-cap);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi svg{width:56px;height:28px;flex:none}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--font);font-size:11px;fill:var(--t-cap);font-variant-numeric:tabular-nums}
svg.chart text.b{fill:var(--t-strong);font-weight:700}
svg.chart text.m{fill:var(--t-sub)}
svg.chart .grid line{stroke:var(--line);stroke-width:1}
svg.chart .axis{stroke:var(--line-2)}
svg.chart [data-tip]{cursor:default}
svg.chart rect[data-tip]:hover,svg.chart circle[data-tip]:hover{opacity:.82}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--t-strong);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.heat td{padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.heat td:first-child{text-align:left;color:var(--t-sub)}
.heat td .cell{display:block;border-radius:6px;padding:3px 8px}
.heat td small{display:block;font-size:11px;color:var(--t-cap)}
.heat th{font-size:12px;color:var(--t-cap);font-weight:500;text-align:right;padding:6px 8px}
.heat th:first-child{text-align:left}
.ftbl td,.ftbl th{white-space:nowrap}
.ftbl tr.b td{font-weight:700;color:var(--t-strong)}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--t-cap);font-size:13px;border:1.5px dashed var(--line-2);border-radius:10px;padding:20px}
.fin{position:absolute;left:0;right:0;bottom:0;padding:40px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to bottom,transparent,var(--bg) 45%);display:grid;place-items:center;pointer-events:none}
.fin .cin{pointer-events:auto;width:min(760px,100%);margin:0;box-shadow:var(--shadow-pop);border-radius:16px;padding:8px 8px 8px 8px}

/* ---------- F20 ---------- */
.conv{width:min(820px,100%);margin:0 auto;padding:28px 0 260px;display:grid;gap:22px}
.conv .bub{max-width:min(560px,70%)}
.para{font-size:15.5px;line-height:1.8;color:var(--t)}
.para .tags{display:flex;gap:4px;margin-top:6px}
.srcgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.srcline{font-size:12.5px;color:var(--t-cap)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sugg p{flex-basis:100%;margin:0;font-size:12.5px;font-weight:500;color:var(--ai-text);display:flex;gap:4px;align-items:center}
.sugg p svg.i{width:14px;height:14px}
.sugg button{text-align:left;padding:6px 12px;border:1px solid color-mix(in srgb,var(--ai-text) 40%,transparent);border-radius:999px;font-size:13px;line-height:1.4;color:var(--ai-text);background:var(--surface)}
.sugg button:hover{background:var(--ai-weak)}
.fin .sugg{width:min(760px,100%);pointer-events:auto;margin-bottom:10px}
.chatside .sugg{padding:0 14px 10px}

/* ---------- v04: 사실 / 해석 구분, 검색, 인사이트 ---------- */
.tag.ai{background:var(--ai-weak);color:var(--ai-text)}
.aib{background:none;padding:0}
.aib .lab{color:var(--ai-text)}
.dl dd.aib{border-radius:0;padding-left:10px}
.ai-lab{display:flex;gap:4px;align-items:center;font-size:12px;font-weight:700;color:var(--ai-text);margin-bottom:6px}
.ai-lab svg.i{width:14px;height:14px}
.lab2{display:flex;gap:4px;align-items:center;font-size:12px;font-weight:700;color:var(--t-cap);margin-bottom:6px}
.sico{display:inline-grid;color:var(--t-cap)}
.res{display:grid;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.rcard .rv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rcard .rv b{font-size:17px;color:var(--t-strong);font-variant-numeric:tabular-nums}
.rcard .rv .l{font-size:13px;color:var(--t-sub)}
.rcard .loc{font-size:12.5px;color:var(--t-cap)}
.rcard .ex{font-size:13.5px;color:var(--t);border-left:3px solid var(--line-2);padding-left:10px;line-height:1.6}
.rcard .ex mark,.ans mark{background:var(--yel-weak);text-decoration:none;cursor:default;padding:0 2px}
.rhead{font-size:13px;color:var(--t-cap)}
.guide{font-size:13px;color:var(--t-sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans .rcard{padding:10px 12px}
.ans .rcard .rv b{font-size:15px}
.ans .guide{margin-top:6px}
.sech{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:22px 0 12px}
.sech h3{margin:0;font-size:16px;color:var(--t-strong)}
.sech .sub{font-size:13px;color:var(--t-cap)}
.icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:14px;align-content:start;min-width:0}
.icard h3{margin:0;font-size:15.5px;color:var(--t-strong);line-height:1.5}
.icard .facts{margin:0}.icard .facts table{min-width:0;font-size:13px}
.icard .facts td,.icard .facts th{padding:6px 6px}
.aip{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--ai-text) 55%,transparent);border-radius:12px;padding:12px 14px}
.aip p{margin:0;font-size:14px;line-height:1.7}
.nrefs{display:grid;gap:2px;margin-top:8px}
.nref{font-size:12px;color:var(--t-cap);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nref:hover{color:var(--ai-text);text-decoration:underline}
.ask2{text-align:left;font-size:13px;color:var(--ai-text);padding:4px 0}
.ask2:hover{text-decoration:underline}
.fact{background:none;border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.conv>.aip{padding:16px 18px;display:grid;gap:12px}
.news{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.news .ncard{flex:none;width:min(380px,85vw);scroll-snap-align:start}
.ncard{display:flex;flex-direction:column;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;min-width:0;transition:box-shadow .15s}
.ncard:hover{box-shadow:var(--shadow)}
.ncard:hover .nt{text-decoration:underline;text-underline-offset:3px}
.ntext{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t-cap);white-space:nowrap;overflow:hidden}
.nm .pi{width:18px;height:18px;border-radius:50%;background:var(--bg-grey);color:var(--t-sub);display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.nm .dotsep{color:var(--t-ph)}
.nt{font-size:15px;font-weight:500;line-height:1.5;color:var(--t-strong);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntext>div:last-child{margin-top:auto}
.nimg{position:relative;width:100%;aspect-ratio:16/9;flex:none;border-radius:10px;overflow:hidden;background:var(--bg-grey)}
.nimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nimg span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--t-ph)}
.themebtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--r-sm);font-size:13px;color:var(--t-sub);width:100%}
.themebtn:hover{background:var(--hover)}
.login .themebtn{position:fixed;top:16px;right:16px;width:auto;background:var(--surface);box-shadow:var(--shadow)}

/* ---------- v05 2차: 사이드바 현재 세션, B10, 보고서 ---------- */
.sdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ai-text);margin-left:8px}
.grp button:has(.sdot){display:flex;align-items:center}
.grp button .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.b10{gap:20px}
.b10 .zone{min-height:0;padding:0;border:0;background:var(--bg-grey);border-radius:16px;gap:6px;align-content:start;transition:background .15s}
/* 파일이 들어가면 칸(면)은 없애고 작은 제목 + 파일만. 끌어 오는 중에만 옅은 면 */
.b10 .zone:not(:has(.dz.big)){padding:0;background:none;border-radius:12px}
.b10 .zone.over:not(:has(.dz.big)){background:var(--hover);box-shadow:0 0 0 8px var(--hover)}
.b10 .zh{padding:0 2px 2px}
.b10 .zone.over{background:var(--hover)}
.zh{font-size:14px;font-weight:700;color:var(--t-strong);padding:2px 4px 2px}
/* 빈 칸: 큰 제목만. 호버·포커스·끌어 오는 중이면 상세 안내가 제목 자리를 대신해요 */
.dz.big{display:grid;place-items:center;height:120px;padding:0;border-radius:16px;width:100%}
.dz.big>span{grid-area:1/1;transition:opacity .15s,transform .15s}
.dz-t{font-size:22px;font-weight:700;color:var(--t-strong);letter-spacing:-.01em}
.dz-d{display:grid;justify-items:center;gap:4px;font-size:14px;font-weight:500;color:var(--t-sub);opacity:0;transform:translateY(6px)}
.dz-d small{font-size:12px;color:var(--t-cap);font-weight:400}
.dz.big:hover,.zone.over .dz.big,.dz.big:focus-visible{background:var(--hover)}
.dz.big:hover .dz-t,.zone.over .dz-t,.dz.big:focus-visible .dz-t{opacity:0;transform:translateY(-6px)}
.dz.big:hover .dz-d,.zone.over .dz-d,.dz.big:focus-visible .dz-d{opacity:1;transform:none}
.zh small{font-weight:400;color:var(--t-cap);margin-left:4px}
.evrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x proximity}
.ecard{flex:none;width:184px;display:grid;gap:6px;align-content:start;padding:10px 10px 12px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);scroll-snap-align:start}
.ecard.w{border-color:var(--yel-line)}
.ecard .et{display:flex;justify-content:space-between;align-items:center}
.ecard .k{font-size:10.5px;font-weight:700;color:var(--t-cap);background:var(--bg-grey);border-radius:6px;padding:3px 6px}
.ecard .icon-btn{width:26px;height:26px}

function msg([k,v,mode,q]){if(k==='u')return `<div class="bub">${esc(v)}</div>`;

   ${card('','[2] 유형자산 감가상각비 (2021–2025)','SKB 포함',ftable(YR,[['SKT',D.cons.ppeDep]],'억원'),'',false)}

 if(v==='why')return `<div class="fact"><div class="mnote">사실 모드에서는 "왜", "어떻게 봐야 하나요" 같은 해석을 하지 않아요. <button class="btn line sm" data-act="toIns" data-v="${esc(q)}">인사이트 모드로 묻기</button></div></div>`;
 return mode==='ins'?`<div class="aip">${aiLab()}<div class="para" style="color:var(--t-sub)">데모에는 CapEx 질문의 답변만 들어 있어요. 예: SKT CapEx가 줄어든 이유는?</div></div>`
  :`<div class="fact">${tagsFact()}<div class="para" style="color:var(--t-sub)">데모에는 CapEx 결과만 들어 있어요. 실제 서비스에서는 적재된 공시와 예산서에서 숫자, 문서, 위치, 원문 문장을 찾아 보여 줘요.</div></div>`;}
function send(q){const mode=S.cmode,key=/capex|설비투자/i.test(q)?'capex':(mode==='fact'&&/왜|이유|어떻게|전망|의미/.test(q))?'why':'none';
 const m=[['u',q,mode],['a',key,mode,q]];
 if(S.route==='i20'||S.cside)curS().log.push(...m);
 else{const id='s'+Date.now();S.sess.unshift({id,t:q,log:m});S.cur=id;S.cside=true;}

/* ================= charts ================= */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function ticks(min,max,n=4){const step=niceMax((max-min)/n);const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const out=[];for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));return out;}
const fmtAx=v=>Math.abs(v)>=10000?(v/10000).toFixed(Math.abs(v)%10000?1:0)+'만':Number.isInteger(v)?com(v):String(+v.toFixed(2));
function frame(W,H,pl,pt,pr,pb,tk,Y){return `<g class="grid">${tk.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('')}</g>${tk.map(t=>`<text x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${fmtAx(t)}</text>`).join('')}`;}
/* bars: series [{name,v,c,fade}] grouped; supports negatives */
function bars(o){const W=o.W||560,H=o.H||220,pl=44,pr=8,pt=18,pb=26,labs=o.labels,ser=o.series,n=labs.length,k=ser.length;
 const all=ser.flatMap(s=>s.v);let mn=Math.min(0,...all),mx=Math.max(0,...all);const tk=ticks(mn,mx);mn=tk[0];mx=tk[tk.length-1];
 const Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);const gw=(W-pl-pr)/n,bw=Math.min(o.bw||28,(gw-10)/k-2);
 let s=frame(W,H,pl,pt,pr,pb,tk,Y);
 labs.forEach((L,i)=>{const gx=pl+i*gw+(gw-(bw*k+2*(k-1)))/2;ser.forEach((se,j)=>{const v=se.v[i];const y0=Y(0),y1=Y(v);const last=i===n-1;
   const op=se.fade&&!last?.45:1;s+=`<rect x="${gx+j*(bw+2)}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="3" style="fill:var(${se.c});opacity:${op}" data-tip="${L} · ${se.name} ${o.fmt?o.fmt(v):com(v)}"/>`;
   if(o.labelLast&&last&&j===0)s+=`<text class="b" x="${gx+j*(bw+2)+bw/2}" y="${v>=0?y1-6:y1+14}" text-anchor="middle">${o.fmt?o.fmt(v):com(v)}</text>`;});
  s+=`<text x="${pl+i*gw+gw/2}" y="${H-8}" text-anchor="middle">${L}</text>`;});
 s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--line-2)"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${s}</svg>`;}
/* lines: series [{name,v,c,bold}] */
function lines(o){const W=o.W||560,H=o.H||220,pl=44,pr=o.pr??96,pt=18,pb=26,labs=o.labels,ser=o.series,n=labs.length;
 const all=ser.flatMap(s=>s.v);let mn=o.min??Math.min(...all),mx=o.max??Math.max(...all);const tk=ticks(mn,mx);mn=tk[0];mx=tk[tk.length-1];
 const X=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
 let s=frame(W,H,pl,pt,pr,pb,tk,Y).replace(/>(-?[\d.,만]+)</g,(m,a)=>'>'+(o.axfmt?o.axfmt(a):a)+'<');
 if(o.ref!==undefined)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" style="stroke:var(--t-cap);stroke-dasharray:4 3"/><text x="${W-pr+6}" y="${Y(o.ref)+4}">${o.refLabel||o.ref}</text>`;
 const ends=[];
 ser.forEach(se=>{const pts=se.v.map((v,i)=>[X(i),Y(v)]);s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:none;stroke:var(${se.c});stroke-width:2;stroke-linejoin:round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:3}" style="fill:var(${se.c});stroke:var(--surface);stroke-width:1.5" data-tip="${labs[i]} · ${se.name?se.name+' ':''}${o.fmt?o.fmt(se.v[i]):com(se.v[i])}"/>`;});
  ends.push({y:pts[n-1][1],t:`${se.name?se.name+' ':''}${o.fmt?o.fmt(se.v[n-1]):com(se.v[n-1])}`,bold:se.bold});});
 ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
 ends.forEach(e=>s+=`<text class="${e.bold?'b':'m'}" x="${X(n-1)+9}" y="${e.y+4}">${e.t}</text>`);
 labs.forEach((L,i)=>{if(n<=6||i%2===0||i===n-1)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${L}</text>`;});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${s}</svg>`;}
/* waterfall: steps [[label,value,isTotal]] */
function waterfall(o){const W=o.W||720,H=o.H||250,pl=48,pr=8,pt=24,pb=34,st=o.steps,n=st.length;let cum=0;const bars=st.map(([l,v,t])=>{let a,b;if(t){a=0;b=v;cum=v;}else{a=cum;b=cum+v;cum=b;}return {l,v,t,a,b};});
 const mx=niceMax(Math.max(...bars.map(b=>Math.max(b.a,b.b)))*1.08),tk=ticks(0,mx),top=tk[tk.length-1];const Y=v=>pt+(top-v)/top*(H-pt-pb);const gw=(W-pl-pr)/n,bw=Math.min(54,gw-18);
 let s=frame(W,H,pl,pt,pr,pb,tk,Y);
 bars.forEach((b,i)=>{const x=pl+i*gw+(gw-bw)/2,y=Math.min(Y(b.a),Y(b.b)),h=Math.max(1,Math.abs(Y(b.a)-Y(b.b)));const c=b.t?'--s1':b.v<0?'--s2':'--s3';
  s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" style="fill:var(${c})" data-tip="${b.l} ${b.t?com(b.v):(b.v>0?'+':'')+com(b.v)}억원"/>`;
  s+=`<text class="${b.t?'b':'m'}" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${b.t?com(b.v):(b.v>0?'+':'')+com(b.v)}</text>`;
  s+=`<text x="${x+bw/2}" y="${H-14}" text-anchor="middle">${b.l}</text>`;
  if(i<n-1){const yc=Y(b.t?b.v:b.b);s+=`<line x1="${x+bw}" x2="${x+gw}" y1="${yc}" y2="${yc}" style="stroke:var(--t-ph);stroke-dasharray:2 2"/>`;}});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${s}</svg>`;}
function legend(items){return `<div class="legend">${items.map(([n,c])=>`<span><i style="background:var(${c})"></i>${n}</span>`).join('')}</div>`;}
function spark(v){const w=72,h=34,mn=Math.min(...v),mx=Math.max(...v),pts=v.map((x,i)=>[i*(w-6)/(v.length-1)+3,h-4-(x-mn)/((mx-mn)||1)*(h-8)]);

 bs.forEach(b=>{const h=document.getElementById(b.dataset.toc);if(h&&h.getBoundingClientRect().top<sc.getBoundingClientRect().top+170)cur=b;});bs.forEach(b=>b.setAttribute('aria-current',b===cur));},true);
