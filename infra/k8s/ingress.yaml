apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: public-nginx
  tls: [{ hosts: [p3-1.skala-ai.com], secretName: team-tls }]
  rules:
    - host: p3-1.skala-ai.com
      http:
        paths:
          - { path: /,    pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "51m"
spec:
  ingressClassName: public-nginx
  tls: [{ hosts: [p3-1.skala-ai.com], secretName: team-tls }]
  rules:
    - host: p3-1.skala-ai.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: backend, port: { number: 8080 } } } }
          - { path: /api/v1/auth, pathType: Prefix, backend: { service: { name: backend, port: { number: 8080 } } } }
          - { path: /api/v1/users, pathType: Prefix, backend: { service: { name: backend, port: { number: 8080 } } } }
          - { path: /api/v1/canvases, pathType: Prefix, backend: { service: { name: backend, port: { number: 8080 } } } }
          - { path: /api/v1/ws, pathType: Prefix, backend: { service: { name: backend, port: { number: 8080 } } } }
---
# auth·canvas 서비스 확인용. 헤더 X-Canary: msa 나 쿠키 canary=always 인 요청만 새 서비스로 간다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: X-Canary
    nginx.ingress.kubernetes.io/canary-by-header-value: msa
    nginx.ingress.kubernetes.io/canary-by-cookie: canary
spec:
  ingressClassName: public-nginx
  tls: [{ hosts: [p3-1.skala-ai.com], secretName: team-tls }]
  rules:
    - host: p3-1.skala-ai.com
      http:
        paths:
          - { path: /api/v1/auth, pathType: Prefix, backend: { service: { name: auth, port: { number: 8080 } } } }
          - { path: /api/v1/users, pathType: Prefix, backend: { service: { name: auth, port: { number: 8080 } } } }
          - { path: /api/v1/canvases, pathType: Prefix, backend: { service: { name: canvas, port: { number: 8080 } } } }
          - { path: /api/v1/ws, pathType: Prefix, backend: { service: { name: canvas, port: { number: 8080 } } } }
