apiVersion: apps/v1
kind: Deployment
metadata: { name: canvas, labels: { app: canvas } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: canvas } }
  template:
    metadata: { labels: { app: canvas } }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: canvas
          image: skala-registry.skala-ai.com/p3-1/canvas
          ports: [{ containerPort: 8080 }]
          lifecycle:
            preStop: { exec: { command: ["sh", "-c", "sleep 10"] } }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }
            - { name: TZ, value: Asia/Seoul }
            - { name: AUTH_SERVICE_BASE_URL, value: "http://auth:8080" }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: ai-server-secrets, key: INTERNAL_API_KEY } }
          envFrom:
            - secretRef: { name: rds-credentials }
            - secretRef: { name: backend-secrets }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: canvas }
spec:
  selector: { app: canvas }
  ports: [{ port: 8080, targetPort: 8080 }]
