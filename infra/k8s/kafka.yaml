# 이벤트 스트리밍 Kafka — KRaft 단일 브로커(ZooKeeper 없음). 클러스터 내부 전용: kafka:9092 
# 백엔드·ai 서비스는 KAFKA_BOOTSTRAP_SERVERS=kafka:9092 로 접속한다. 외부 노출 없음.
# 토픽 자동 생성은 끈다. 토픽은 규약대로 선언적으로 만든다.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, labels: { app: kafka } }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - { name: client, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: TZ, value: Asia/Seoul }
            # KRaft: 브로커 겸 컨트롤러 1대. 클러스터 ID는 고정값(재생성해도 로그와 맞게 유지)
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka:9093" }
            - { name: CLUSTER_ID, value: "telescope-kafka-0001-kraft" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            # 클러스터 내부 클라이언트가 접속하는 주소(단일 브로커라 Service 이름으로 광고)
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            # 토픽 자동 생성 끔(규약대로 선언적으로 만든다)
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            # 단일 브로커라 내부 토픽 복제 1
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  clusterIP: None            # 헤드리스: kafka-0.kafka 로 브로커를 직접 가리킴(KRaft 쿼럼 주소와 일치)
  selector: { app: kafka }
  ports:
    - { name: client, port: 9092, targetPort: 9092 }
    - { name: controller, port: 9093, targetPort: 9093 }
