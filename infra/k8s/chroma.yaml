# 문서 검색용 ChromaDB 서버. 클러스터 내부 전용: http://chroma:8000
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: chroma, labels: { app: chroma } }
spec:
  serviceName: chroma
  replicas: 1 # 디스크(RWO)를 한 파드만 붙이므로 1대 고정
  selector: { matchLabels: { app: chroma } }
  template:
    metadata: { labels: { app: chroma } }
    spec:
      enableServiceLinks: false
      containers:
        - name: chroma
          image: chromadb/chroma:1.5.9
          ports: [{ containerPort: 8000 }]
          env:
            - { name: TZ, value: Asia/Seoul }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: chroma }
spec:
  selector: { app: chroma }
  ports: [{ port: 8000, targetPort: 8000 }]
