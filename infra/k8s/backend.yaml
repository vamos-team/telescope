apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, labels: { app: backend } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: skala-registry.skala-ai.com/p3-1/backend
          ports: [{ containerPort: 8080 }]
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }
            - { name: TZ, value: Asia/Seoul }
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_PORT, value: "3306" }
            - { name: MYSQL_DATABASE, value: telescope }
            - { name: MYSQL_USER, value: telescope }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD } }
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits:   { cpu: 700m, memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
